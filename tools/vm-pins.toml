# The inputs of tools/vm-smoke.py, each pinned by URL and SHA-256 (tests/unit/test_vm_smoke.py
# checks the table's shape; the script verifies every file on every use). Kept in
# FSBPYR_TEST_DOWNLOADS (or ~/.cache/fsbpyr-vm-smoke).
#
# A kernel gives its image and its config as members of the package; the script refuses a
# package whose config lacks `option` = y, and the guest must report `pagesize` bytes.

# Raspberry Pi 5's kernel (BCM2712): 16 KiB pages. Booted on QEMU's `virt` machine (it has the
# PL011 and GIC drivers built in); arm64 Image, gzip-compressed. Version and SHA-256 from the
# archive's trixie Packages.gz.
[kernel."16k"]
kind = "deb"
url = "https://archive.raspberrypi.com/debian/pool/main/l/linux/linux-image-6.18.50+rpt-rpi-2712_6.18.50-1+rpt1_arm64.deb"
sha256 = "41a73543781af93f591adddcbf1e2fcc478450784ba2a27be2f07af84ce2bbb6"
image = "./boot/vmlinuz-6.18.50+rpt-rpi-2712"
config = "./boot/config-6.18.50+rpt-rpi-2712"
option = "CONFIG_ARM64_16K_PAGES"
pagesize = 16384

# EL8's kernel: 64 KiB pages (RHEL's aarch64 kernels, as Rocky Linux 8.10 rebuilds them). The
# SHA-256 is the one in the BaseOS repository's primary.xml.
[kernel."64k"]
kind = "rpm"
url = "https://dl.rockylinux.org/pub/rocky/8.10/BaseOS/aarch64/os/Packages/k/kernel-core-4.18.0-553.97.1.el8_10.aarch64.rpm"
sha256 = "cccb49fa0f99bb1fbb71fbd0cfb029213bfc7c6315f4b637955f53dbacd241d1"
image = "./lib/modules/4.18.0-553.97.1.el8_10.aarch64/vmlinuz"
config = "./lib/modules/4.18.0-553.97.1.el8_10.aarch64/config"
option = "CONFIG_ARM64_64K_PAGES"
pagesize = 65536

# The root file system the initramfs holds (a tar archive, gzip or xz).

# debuerreotype's trixie-slim arm64 rootfs at a pinned commit of docker-debian-artifacts'
# dist-arm64v8 branch (the OCI layer blob, named by its own SHA-256). glibc 2.41.
[userland.debian]
file = "debian-trixie-slim-rootfs.tar.gz"
url = "https://github.com/debuerreotype/docker-debian-artifacts/raw/9c4818e3bfd35139d3798b0420e9c46836658b2e/trixie/slim/oci/blobs/rootfs.tar.gz"
sha256 = "ddc0c1e36a6793411b6c8d48e1ddad2987405d377da92bcf532ed3181c2e4d62"

# Rocky Linux 8.10's container base image, for EL8 builds (glibc 2.28). The SHA-256 is the one
# in the image's .CHECKSUM file.
[userland.el8]
file = "Rocky-8-Container-Base-8.10-20240528.0.aarch64.tar.xz"
url = "https://dl.rockylinux.org/pub/rocky/8.10/images/aarch64/Rocky-8-Container-Base-8.10-20240528.0.aarch64.tar.xz"
sha256 = "35aae39c49fcfd41c6543ca815c5136198085a1e3e5ba81b7db1005a12234efb"
