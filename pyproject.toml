[project]
name = "fsbpyr"
version = "0.21.0"
description = "Fast single-binary Python CLI runtime and packager"
authors = [{ name = "Kresimir Sparavec", email = "ksparavec@devitops.com" }]
license = "LicenseRef-fsbpyr-MIT-with-runtime-exception"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "backports.zstd; python_version < '3.14'",
    "click>=8.5",
    "packaging>=25",
]

[project.scripts]
fsbpyr = "fsbpyr.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# a run builds gigabytes of executables: keep only what failed tests left (/tmp is often tmpfs)
tmp_path_retention_policy = "failed"
markers = [
    "slow: takes more than a few seconds",
    "sanitized: also runs with the ASan/UBSan launcher (D38)",
    "version_rule: runs the Python version rule as it is (other tests build for the Python they run on)",
]

[tool.coverage.run]
# by path: boot code also runs in-process under its embedded names (_fsbpyr_boot, _fsbpyr_rt)
source = ["src/fsbpyr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under is compared with the total rounded to this many decimals (at 0, 92.5% passes 93)
precision = 2
# make test-ci's total minus 1, and never below IMPLEMENTATION_PLAN.md §7's 80
fail_under = 92.75

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "tests/corpus/*/work"]  # work/ holds the apps' own inputs

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S302", "S603", "PLR0913", "PLR0917"]
"tests/fixtures/projects/**" = ["PLC0415", "S701"]  # lazy imports on purpose; text templates
"tests/corpus/**" = ["PLC0415", "S701", "E402"]  # the same: apps of the corpus
"src/fsbpyr/boot/**" = ["S302"]  # unmarshals code from its own payload
"src/fsbpyr/runtime/**" = ["S603"]  # runs the pinned interpreter and the located toolchain
"src/fsbpyr/staging.py" = ["S603"]  # runs uv with argument lists, never a shell
"src/fsbpyr/vcs.py" = ["S603"]  # runs git (found on PATH) with argument lists

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["^tests/(fixtures|corpus)/"]  # fixture projects use their own dependencies
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["pkg", "pkg.*", "ns.*"]  # demo-app packages that exist only inside test executables
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backports", "backports.zstd"]
ignore_missing_imports = true  # a dependency below 3.14 only: typed on 3.12 and 3.13, Any on 3.14
