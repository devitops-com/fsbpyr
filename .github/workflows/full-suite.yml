name: Full suite

# Every test and check there is, so that a release only builds and publishes (release.yml tests
# nothing):
#   - build (build.yml, with its checks): the release build, its smoke test and an independent
#     rebuild, the executables and their SBOMs compared byte for byte. release.yml builds the
#     tagged commit the same way, and differs in the tag the executables record (vcs.git_state):
#     the run a release stands on comes before its tag, so here they record none;
#   - suite: the whole test suite but the portability tests and the corpus, as an unprivileged
#     user in a Debian trixie container: natives, compatibility, the ASan/UBSan launcher, the
#     fuzzer, the cache-directory and GC tests, the ownership checks, and the coverage gates;
#   - corpus: the real-world apps of tests/corpus, built and compared with their venvs;
#   - portability: the portability tests (tests/e2e/test_portability.py, which need `podman run`
#     on the runner host);
#   - vm-smoke: aarch64 apps run in a QEMU system VM whose kernel has 64 KiB pages
#     (tools/vm-smoke.py);
#   - el8-*: the EL8 (glibc 2.28) stubs that el8.yml publishes with a release, which tests
#     nothing: every Python's stub linked twice and compared, and checked; on the default Python,
#     the stub-dependent tests in the EL8 test mode, the portability matrix with apps built
#     `--glibc 2.28` (rockylinux:8 and almalinux:8 too), a native-heavy corpus subset and the
#     64 KiB-page VM with the EL8 userland.
# It runs on every push to main, which is a merge, that changes more than documentation (*.md
# files and docs/): tools/release/release-assets.sh tags only a main commit whose run passed, or one
# that changes only documentation since such a commit (green-run.sh), and the publish job of
# release.yml checks that again. A merge never carries a CI skip instruction in its message:
# GitHub applies it to a tag pushed on that commit too, and release.yml would not run. Also
# weekly, with a longer fuzzing run (below), and on request; no nightly run: main changes by
# merges only, so one would test the same commit night after night (owner, 2026-10-21). Pull
# requests start nothing: a branch is tested locally before its pull request. The fuzz corpora
# are kept in actions/cache (release.yml stays cache-free).
# One fsbpyr per Python version and per target (Phase 9): every job but the EL8 ones (below) runs
# once per (target, Python) entry, the development environment on that Python and that variant's
# executable (dist/fsbpyr for the default version, the one .python-version pins; dist/fsbpyr-3.X
# for the others), each target on a runner of its architecture (x86_64-linux-gnu on
# ubuntu-24.04, aarch64-linux-gnu on ubuntu-24.04-arm). Every trigger runs every target and
# Python. Adding a Python version adds an entry to every `python` list here and to build.yml's,
# adding a target one to those `target` lists and the `include` entries that name its runner.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "wiki/**"]  # the documentation green-run.sh lets a release stand on
  schedule:
    # Weekly. Keep the string equal to WEEKLY in "Choose the fuzzing time".
    - cron: "43 3 * * 0"
  workflow_dispatch:

# A push to main replaces its predecessor's run; a scheduled or manual run is never cancelled.
concurrency:
  group: full-suite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # The release build and its checks: what release.yml builds from the tag, built and checked
  # here first.
  build:
    uses: ./.github/workflows/build.yml
    with:
      checks: true

  suite:
    name: suite (${{ matrix.target }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]  # one entry per Python version a release is built for
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    # Debian trixie by digest, as build.yml (a multi-arch index: one image per runner
    # architecture). Privileged: rootless podman for the tests that map
    # a second range of user ids, strace and user namespaces inside the container. At most 8192
    # tasks and 14 GiB without swap (the runners have 16): a runaway app (one restarting itself
    # through sys.executable) is stopped here before it takes the runner with it; the tests
    # contain each run of an app besides (tests/support/contain.py). /var/tmp, the tests'
    # temporary files, is a directory of the runner's own disk, not a tmpfs, whose files would
    # count against those 14 GiB beside 4 test processes; the step "The temporary files' file
    # system" checks what the tests need of it first. The runner's whole file system is at
    # /runner-host, where the step "Room on the runner's disk" removes what it does not need.
    container:
      image: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
      options: --privileged --pids-limit 8192 --memory 14g --memory-swap 14g
      volumes:
        - /mnt/fsbpyr-tmp:/var/tmp
        - /:/runner-host
    timeout-minutes: 60
    env:
      TEST_DOWNLOADS: /home/tester/test-downloads  # tests/support/downloads.py: the kept ones
    steps:
      # As root. git before the checkout (it needs the tags); bootstrap.sh's packages; rootless
      # podman and what it needs in a container (uidmap, passt, catatonit, fuse-overlayfs).
      - name: Install the build prerequisites and podman
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make clang-22 lld-22 \
            podman uidmap passt catatonit fuse-overlayfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: the fuzzing time and the executable's --version read them

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Runners differ in disk, and some have too little for the suite: tools/runner-disk.sh
      # removes software of the runner image that this container never uses, then fails at once
      # unless the runner's file system (/var/tmp's, and /home/tester's) has 20 GiB free beyond a
      # tenth of its size: more than the job takes, which "Memory and disk used" shows.
      - name: Room on the runner's disk
        run: |
          bash tools/runner-disk.sh /runner-host /var/tmp 20
          df -B1M --output=avail /var/tmp | tail -n 1 > /root/disk-free.txt

      # The uv that tools/release/uv.version names, as build.yml installs it. The tester's
      # Python and caches are its own (below); only the uv executable is shared.
      - name: Install uv
        run: |
          echo "FSBPYR_UV_VERSION=$(sh tools/release/install-uv.sh /usr/local/bin)" >> "$GITHUB_ENV"

      # The sanitizer runtimes, llvm-objdump and llvm-cov, gcc, strace, groff, the user `tester`
      # and the directories the cache-ownership tests walk through.
      - name: Set up the test environment
        run: bash tools/test-setup.sh

      # Not as root: as root some cache-ownership tests have nothing to test (root owns /usr)
      # and podman would not be rootless. The checkout is copied to the user's home, where it
      # and fsbpyr's cache belong to that user, as fsbpyr requires.
      - name: An unprivileged user, with rootless podman
        run: |
          grep -q '^tester:' /etc/subuid || echo 'tester:100000:65536' >> /etc/subuid
          grep -q '^tester:' /etc/subgid || echo 'tester:100000:65536' >> /etc/subgid
          cp -a "$GITHUB_WORKSPACE" /home/tester/src
          # Inside a container: no systemd for cgroups or the event log, and an overlay
          # filesystem that podman's own overlay storage cannot stack on.
          mkdir -p /home/tester/.config/containers /home/tester/run /home/tester/fuzz-corpus \
            /home/tester/fuzz-corpus-sig
          printf '[storage]\ndriver = "vfs"\n' > /home/tester/.config/containers/storage.conf
          printf '[engine]\ncgroup_manager = "cgroupfs"\nevents_logger = "file"\n' \
            > /home/tester/.config/containers/containers.conf
          chown -R tester: /home/tester
          chmod 700 /home/tester/run
          # Ubuntu's AppArmor keeps unprivileged processes out of user namespaces (rootless
          # podman, the `unshare -r` tests); the setting is the host's, writable when privileged
          # (actions/runner-images#10443).
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then echo 0 > "$f"; fi
          # The tests' temporary files: the runner's disk (the volume above), open to all as
          # /tmp is; its file system and free space in the log.
          chmod 1777 /var/tmp
          findmnt -T /var/tmp
          df -h /var/tmp
          # What runs as tester from here on: its own clean environment, in its copy.
          # /home/tester/llvm23 is clang/lld 23 once the bootstrap has fetched them (below).
          cat > /usr/local/bin/as-tester <<'WRAPPER'
          #!/bin/sh
          cd /home/tester/src || exit 1
          exec runuser -u tester -- env -i HOME=/home/tester USER=tester LANG=C.UTF-8 \
            XDG_RUNTIME_DIR=/home/tester/run TMPDIR=/var/tmp \
            PATH=/home/tester/llvm23:/home/tester/.local/bin:/usr/local/bin:/usr/bin:/bin "$@"
          WRAPPER
          chmod 755 /usr/local/bin/as-tester

      # 600 s when the launcher or the fuzz harness changed since the last tag, so that the run
      # a release is made from fuzzes for 600 s whenever the launcher changed since the
      # previous release; 600 s on the weekly schedule; else the test's 30 s default. The readers
      # of keys (tests/fuzz/sig_fuzz.c) explore for a quarter of it, 30 s at least
      # (tests/e2e/test_fuzz.py): the suite waits for the worker that fuzzes.
      - name: Choose the fuzzing time
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          WEEKLY="43 3 * * 0"
          seconds=30
          if [ "$SCHEDULE" = "$WEEKLY" ]; then
            seconds=600
          elif ! last="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            seconds=600  # no tag to compare with
          elif ! git diff --quiet "$last" HEAD -- src/fsbpyr/launcher tests/fuzz; then
            seconds=600
          fi
          echo "FSBPYR_FUZZ_SECONDS=$seconds" | tee -a "$GITHUB_ENV"

      # What earlier runs' fuzzing found interesting: the run starts from it and adds to it.
      - name: Restore the fuzz corpus
        id: corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/tester/fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-${{ matrix.python }}-

      # The same for the readers of keys (test_fuzz.py): the directory beside the payload corpus
      # whose name ends in -sig, in a cache of its own. Not inside the payload corpus: libFuzzer
      # reads a corpus with its subdirectories.
      - name: Restore the fuzz corpus of the readers of keys
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/tester/fuzz-corpus-sig
          key: fuzz-corpus-sig-${{ matrix.target }}-${{ matrix.python }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-sig-${{ matrix.target }}-${{ matrix.python }}-

      - name: Show the corpus
        run: |
          echo "restored from: ${{ steps.corpus.outputs.cache-matched-key || 'nothing (empty corpus)' }}"
          echo "corpus files:  $(find /home/tester/fuzz-corpus -type f | wc -l)"
          echo "sig corpus files: $(find /home/tester/fuzz-corpus-sig -type f | wc -l)"
          chown -R tester: /home/tester/fuzz-corpus /home/tester/fuzz-corpus-sig

      # The default version (the Python of .python-version) is no variant: `make bootstrap`,
      # dist/fsbpyr, installed under ~/.local. Another is a variant: `make bootstrap PYTHON=3.X`
      # builds dist/fsbpyr-3.X in the environment .venv-3.X and installs nothing. SUFFIX,
      # MAKE_ARGS, UV_ENV and UV_RUN tell the steps below which; the Python is installed for
      # tester: the pinned patch release of .python-version, else the minor version's newest.
      - name: The Python of this entry
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          if [ "$MATRIX_PYTHON" = "$(cut -d. -f1,2 .python-version)" ]; then
            echo "SUFFIX=" >> "$GITHUB_ENV"
            echo "MAKE_ARGS=" >> "$GITHUB_ENV"
            echo "UV_ENV=" >> "$GITHUB_ENV"
            echo "UV_RUN=uv run --locked" >> "$GITHUB_ENV"
            as-tester uv python install "$(cat .python-version)"
          else
            echo "SUFFIX=-$MATRIX_PYTHON" >> "$GITHUB_ENV"
            echo "MAKE_ARGS=PYTHON=$MATRIX_PYTHON" >> "$GITHUB_ENV"
            echo "UV_ENV=UV_PROJECT_ENVIRONMENT=.venv-$MATRIX_PYTHON" >> "$GITHUB_ENV"
            echo "UV_RUN=uv run --python $MATRIX_PYTHON --locked" >> "$GITHUB_ENV"
            as-tester uv python install "$MATRIX_PYTHON"
          fi

      # What the tests need of /var/tmp, checked as tester before the bootstrap and the suite, so
      # that a wrong file system fails here in minutes, not in a test among thousands: 999-byte
      # symlink targets (test_cache_root.py) and set-id bits (tests/support/requires.py).
      - name: The temporary files' file system
        run: |
          as-tester $UV_ENV $UV_RUN python -c 'from pathlib import Path
          from tests.support import requires
          requires.long_symlink_targets(Path("/var/tmp"))
          requires.set_id_bits(Path("/var/tmp"))
          print("/var/tmp: 999-byte symlink targets and set-id bits")'

      # The packages are present, so no sudo: the locked environment, the runtime, fsbpyr in
      # three stages and, for the default version, `make install` under tester's ~/.local.
      - name: make bootstrap
        run: as-tester FSBPYR_UV_VERSION="$FSBPYR_UV_VERSION" make bootstrap $MAKE_ARGS

      # The clang/lld 23 the bootstrap fetched (LLVM's release tarball, tools/release/llvm23)
      # first on tester's PATH: the runtime builds below and the tests' own link with it.
      - name: clang/lld 23 on PATH
        run: |
          clang="$(as-tester bash tools/bootstrap.sh --llvm23)"
          ln -sfn "$(dirname "$clang")" /home/tester/llvm23

      # tests/e2e/test_dispatch.py builds fsbpyr on another Python, which needs that Python
      # installed and its runtime in the cache; the bootstrap built the runtime of this entry's
      # Python only. Each runtime is built by fsbpyr on its own Python: an older Python cannot
      # canonicalize a newer one's bytecode.
      # The one other Python the suite needs: tests/e2e/test_dispatch.py's OTHER, the newest
      # supported one but this entry's. Its runtime goes into the kept downloads' cache
      # (FSBPYR_TEST_DOWNLOADS, below), where that test looks for it.
      - name: The other version's runtime
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          other=3.15
          [ "$MATRIX_PYTHON" != 3.15 ] || other=3.14
          as-tester uv python install "$other"
          as-tester UV_PROJECT_ENVIRONMENT=".venv-$other" FSBPYR_CACHE_DIR="$TEST_DOWNLOADS/cache" \
            uv run --python "$other" --locked fsbpyr runtime build --python "$other"

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsbpyr-${{ matrix.python }}-${{ matrix.target }}
          path: /home/tester/src/dist/fsbpyr${{ env.SUFFIX }}
          if-no-files-found: error

      - name: make check
        run: as-tester make check $MAKE_ARGS

      # clang's static analyzer over the launcher sources: a finding fails the run, as the
      # launcher has none and clang is pinned (tools/release/llvm23), so its output does not drift.
      - name: make check-c (clang --analyze)
        run: as-tester make check-c $MAKE_ARGS

      # Everything but the portability tests and the corpus (the jobs below), in one process
      # per core (4 on GitHub's runners for public repositories), each test file in one of them,
      # as `make test` runs it: with the kept downloads (FSBPYR_TEST_DOWNLOADS, on the
      # container's disk, not the /var/tmp tmpfs), the main process fetches the pinned downloads
      # and builds the suite's runtimes once before the workers start, each of which would
      # otherwise build its own. Nothing in the suite skips, so a test that cannot run here fails
      # the step. Branch coverage below pyproject.toml's fail_under fails it too (pytest-cov
      # combines the workers'). The launcher programs the tests build are instrumented for
      # llvm-cov and kept (FSBPYR_LLVM_COV_DIR), for the report below. The runner disk's free
      # space is sampled each second meanwhile, for the report "Memory and disk used".
      - name: The whole suite
        run: |
          echo "$(nproc) cores"
          while df -B1M --output=avail /var/tmp | tail -n 1; do sleep 1; done \
            >> /root/disk-free.txt 2> /dev/null < /dev/null &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          as-tester $UV_ENV \
            FSBPYR_TEST_DOWNLOADS="$TEST_DOWNLOADS" \
            FSBPYR_FUZZ_SECONDS="$FSBPYR_FUZZ_SECONDS" FSBPYR_FUZZ_CORPUS=/home/tester/fuzz-corpus \
            FSBPYR_LLVM_COV_DIR=/home/tester/llvm-cov/bin \
            LLVM_PROFILE_FILE=/home/tester/llvm-cov/prof/%p-%m.profraw \
            $UV_RUN pytest -n 4 --dist loadfile --ignore=tests/e2e/test_portability.py \
              --ignore=tests/e2e/test_corpus.py --durations=30 \
              --junitxml=full.xml --cov --cov-report=xml

      # What the run took: the container's memory high-water mark (cgroup v2; page cache
      # included, so it reaches the limit when the disk is busy, which by itself kills nothing),
      # its memory events (oom_kill: processes the limit killed) and its disks: the free space
      # after "Room on the runner's disk" and the lowest in the suite, the difference being the
      # most the job took (what "Room on the runner's disk" asks for must stay above it).
      - name: Memory and disk used
        if: ${{ !cancelled() }}
        run: |
          peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null) || peak=
          if [ -n "$peak" ]; then
            echo "memory.peak: $(( peak >> 20 )) MiB of 14336 (page cache included)"
          else
            echo "memory.peak: unknown"
          fi
          cat /sys/fs/cgroup/memory.events 2>/dev/null || echo "memory.events: unknown"
          df -h /var/tmp /home/tester || true
          awk 'NR == 1 { room = $1 } NR == 1 || $1 < low { low = $1 }
            END { if (NR > 1) print "disk:", room, "MiB free after making room,", low,
              "MiB at the lowest in the suite: the job took", room - low, "MiB" }' \
            /root/disk-free.txt || echo "disk: unknown"

      # IMPLEMENTATION_PLAN.md §7 sets 90% for payload/ and elf.py, above the 80% overall; this
      # reads the data the suite left in .coverage.
      - name: Coverage of payload/ and elf.py
        run: |
          as-tester $UV_ENV $UV_RUN coverage report \
            --include='src/fsbpyr/payload/*,src/fsbpyr/elf.py' --fail-under=90

      # Informational: the launcher sources that the probes and the fuzz harness exercised, one
      # row each (each session compiles a copy, named by the sources' place in the repository:
      # tests/e2e/conftest.py), the tests' own sources (tests/probes, tests/fuzz) left out. The
      # lines and branches run, per file, go to launcher-coverage.lcov, uploaded beside the
      # report. llvm-profdata and llvm-cov are LLVM 23's (/home/tester/llvm23, first on PATH), as
      # is the clang that instrumented them.
      - name: Launcher coverage (llvm-cov)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          as-tester bash -c '
            set -eu
            cd /home/tester/llvm-cov
            llvm-profdata merge -sparse prof/*.profraw -o all.profdata
            set -- bin/*
            first="$1"; shift
            objects=(); for b in "$@"; do objects+=(-object "$b"); done
            llvm-cov export -format=lcov "$first" "${objects[@]}" -instr-profile=all.profdata \
              "-ignore-filename-regex=/tests/(probes|fuzz)/" > /home/tester/launcher-coverage.lcov
            llvm-cov report "$first" "${objects[@]}" -instr-profile=all.profdata \
              "-ignore-filename-regex=/tests/(probes|fuzz)/"' | tee /home/tester/launcher-coverage.txt
          { echo '### Launcher coverage (llvm-cov, informational)'; echo '```'
            cat /home/tester/launcher-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Also when a test failed, as long as the suite ran. For the portability job.
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-suite-${{ matrix.python }}-${{ matrix.target }}
          path: |
            /home/tester/src/full.xml
            /home/tester/src/coverage.xml
            /home/tester/launcher-coverage.txt
            /home/tester/launcher-coverage.lcov
          if-no-files-found: warn

  # The real-world corpus (tests/corpus, TST-3): its apps built and compared with their venvs,
  # in a job of its own beside the suite, which it would otherwise take past its timeout. The
  # same container and user as the suite; temporary files on the container's disk, not a
  # tmpfs: a big app's venv, executable and caches take gigabytes while it runs. `make
  # test-corpus` builds the runtime (and fetches clang/lld 23) itself. The runner's file system
  # is at /runner-host, as in the suite job.
  corpus:
    name: corpus (${{ matrix.target }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]  # as in the suite job
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container:
      image: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
      options: --pids-limit 8192 --memory 14g --memory-swap 14g  # as the suite job's
      volumes:
        - /:/runner-host
    timeout-minutes: 60
    steps:
      - name: Install the build prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make clang-22 lld-22 zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: fsbpyr's --version reads them

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # As in the suite job; the temporary files are on the container's disk, the runner's file
      # system.
      - name: Room on the runner's disk
        run: |
          bash tools/runner-disk.sh /runner-host /tmp 20
          df -B1M --output=avail /tmp | tail -n 1 > /root/disk-free.txt

      - name: Install uv
        run: sh tools/release/install-uv.sh /usr/local/bin > /dev/null

      # As in the suite job: a user of its own, its copy of the checkout and a clean environment
      # (GitHub's /github/home belongs to another user, and fsbpyr refuses a cache below it).
      - name: An unprivileged user
        run: |
          useradd --create-home --uid 1000 tester
          cp -a "$GITHUB_WORKSPACE" /home/tester/src
          chown -R tester: /home/tester
          cat > /usr/local/bin/as-tester <<'WRAPPER'
          #!/bin/sh
          cd /home/tester/src || exit 1
          exec runuser -u tester -- env -i HOME=/home/tester USER=tester LANG=C.UTF-8 \
            PATH=/home/tester/.local/bin:/usr/local/bin:/usr/bin:/bin "$@"
          WRAPPER
          chmod 755 /usr/local/bin/as-tester

      # The default version runs in .venv, another in .venv-3.X (the Makefile's PYTHON=3.X).
      - name: The Python of this entry
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          if [ "$MATRIX_PYTHON" = "$(cut -d. -f1,2 .python-version)" ]; then
            echo "MAKE_ARGS=" >> "$GITHUB_ENV"
            as-tester uv python install "$(cat .python-version)"
          else
            echo "MAKE_ARGS=PYTHON=$MATRIX_PYTHON" >> "$GITHUB_ENV"
            as-tester uv python install "$MATRIX_PYTHON"
          fi

      # An app whose lock needs a package without a wheel on this Python and machine
      # (tests/support/no-wheels.txt) is not part of the run. The free space is sampled as in the
      # suite job.
      - name: make test-corpus
        run: |
          while df -B1M --output=avail /tmp | tail -n 1; do sleep 1; done \
            >> /root/disk-free.txt 2> /dev/null < /dev/null &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          as-tester JOBS=4 \
            PYTEST_ADDOPTS="--durations=30 --junitxml=corpus.xml" make test-corpus $MAKE_ARGS

      # As the suite job's "Memory and disk used" reports it.
      - name: Disk used
        if: ${{ !cancelled() }}
        run: |
          awk 'NR == 1 { room = $1 } NR == 1 || $1 < low { low = $1 }
            END { if (NR > 1) print "disk:", room, "MiB free after making room,", low,
              "MiB at the lowest in the corpus: the job took", room - low, "MiB" }' \
            /root/disk-free.txt || echo "disk: unknown"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.python }}-${{ matrix.target }}
          path: /home/tester/src/corpus.xml
          if-no-files-found: warn

  # The portability matrix: the apps run on 12 distributions (glibc 2.34 to 2.44; the 11 with an
  # arm64 variant on aarch64, tests/support/images.py) and the objdump check of the glibc floor.
  # On the runner host, without a container: the runner image ships Podman, and nested podman in
  # the suite job's container failed. Needs the suite job's executable, which builds the apps
  # (D4: no compiler); its conclusion is part of the run's, which the release gate
  # (tools/release/green-run.sh) checks.
  portability:
    name: portability (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: suite
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]  # as in the suite job
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default version's executable is dist/fsbpyr, another's dist/fsbpyr-3.X.
      - name: Which variant
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          if [ "$MATRIX_PYTHON" = "$(cut -d. -f1,2 .python-version)" ]; then
            echo "SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "SUFFIX=-$MATRIX_PYTHON" >> "$GITHUB_ENV"
          fi

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsbpyr-${{ matrix.python }}-${{ matrix.target }}
          path: dist

      # The uv that tools/release/uv.version names, for this runner's architecture; llvm for
      # llvm-objdump (the tests that read the executables' sections fail without it).
      - name: Install uv and llvm
        run: |
          sh tools/release/install-uv.sh "$RUNNER_TEMP/bin" > /dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends llvm

      # Each run pulls 12 images, 11 of them from Docker Hub (the SLES one comes anonymously from
      # registry.suse.com); a read-only token avoids anonymous Docker Hub rate limits. A pull that
      # fails fails the test, never skips it.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::no DOCKERHUB_TOKEN secret: pulling anonymously"
          else
            printf '%s' "$DOCKERHUB_TOKEN" | podman login docker.io -u "$DOCKERHUB_USERNAME" \
              --password-stdin
          fi

      # The tests run on .python-version's Python; the apps are built for the variant's.
      - name: Build the apps
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          chmod +x dist/fsbpyr$SUFFIX
          uv python install "$(cat .python-version)" "$MATRIX_PYTHON"
          tools/portability-apps.sh dist/fsbpyr$SUFFIX "$RUNNER_TEMP/apps" "$MATRIX_PYTHON"

      - name: The portability tests
        run: |
          FSBPYR_PORTABILITY_APPS="$RUNNER_TEMP/apps" \
            uv run --locked pytest tests/e2e/test_portability.py -rf --tb=short \
              --junitxml=portability.xml

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portability-${{ matrix.python }}-${{ matrix.target }}
          path: portability.xml
          if-no-files-found: warn

  # The aarch64 apps in a QEMU system VM with 64 KiB pages (EL8's kernel), on a Debian trixie
  # userland (tools/vm-smoke.py, pins in tools/vm-pins.toml): the runners' own kernels have 4 KiB
  # pages. 16K-page kernels are not tested (owner decision 2026-10-27; Raspberry Pi 5's hung
  # before /init under this QEMU). Under TCG, a few minutes. Only the default Python:
  # the page size matters to the launcher and the payload, not to the interpreter. The apps are
  # the aarch64 suite job's executable and two fixtures it builds, a pure-Python one and one with
  # natives. Its conclusion is part of the run's, which the release gate
  # (tools/release/green-run.sh) checks.
  vm-smoke:
    name: vm-smoke (aarch64-linux-gnu)
    needs: suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Which Python
        id: python
        run: echo "version=$(cut -d. -f1,2 .python-version)" >> "$GITHUB_OUTPUT"

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsbpyr-${{ steps.python.outputs.version }}-aarch64-linux-gnu
          path: dist

      # The uv that tools/release/uv.version names; qemu-system-arm has qemu-system-aarch64.
      - name: Install uv and QEMU
        run: |
          sh tools/release/install-uv.sh "$RUNNER_TEMP/bin" > /dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-system-arm

      - name: Build the apps
        env:
          APP_PYTHON: ${{ steps.python.outputs.version }}
        run: |
          chmod +x dist/fsbpyr
          uv python install "$(cat .python-version)"
          mkdir -p "$RUNNER_TEMP/apps"
          for name in hello native; do
            cp -a "tests/fixtures/projects/$name" "$RUNNER_TEMP/$name"
            dist/fsbpyr build "$RUNNER_TEMP/$name" --python "$APP_PYTHON" \
              -o "$RUNNER_TEMP/apps/$name"
          done

      # A command that exits non-zero, or whose output lacks the text after `=>`, fails the job.
      # Exit 3: a pinned kernel or root file system is gone from its mirror; a warning, so a mirror
      # cannot block a release, until the pin is renewed (CONTRIBUTING.md).
      - name: Boot the 64K kernel and run the apps
        run: |
          status=0
          uv run --locked python tools/vm-smoke.py --kernel 64k \
            --app dist/fsbpyr --app "$RUNNER_TEMP/apps/hello" --app "$RUNNER_TEMP/apps/native" \
            --run 'fsbpyr --version' \
            --run 'fsbpyr inspect /apps/fsbpyr => glibc >= 2.34' \
            --run "hello 'x y' => hello ['x y']" \
            --run 'FSBPYR_SELFTEST=1 hello => selftest ok' \
            --run 'native => orjson {"a":[1,2]}' \
            --run 'FSBPYR_SELFTEST=natives native => all natives load (2 extensions)' || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::vm-smoke: a pinned input is unavailable; re-pin tools/vm-pins.toml"
            exit 0
          fi
          exit "$status"

  # ------------------------------------------------------------------------- EL8 (glibc 2.28)
  # The stubs that el8.yml links from a release's tag and publishes in the companion release
  # el8-vX.Y.Z, checked and tested here, where they gate the release like every other job (owner,
  # 2026-11-03; el8.yml tests nothing). Only what differs from a default build is tested: the
  # stub (boot code, payload format, classification and the build pipeline are the same bytes).
  # el8-stub runs every Python; the other EL8 jobs run the default Python only, which el8-python
  # reads (owner, 2026-10-26: CI minutes; the stubs differ per Python only in the linked
  # libpython, which el8-stub checks for every Python).

  # The default Python, the one .python-version names, for the EL8 jobs but el8-stub.
  el8-python:
    name: el8 python
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.python.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .python-version
        id: python
        run: |
          python="$(cut -d. -f1,2 .python-version)"
          [[ "$python" =~ ^3\.[0-9]+$ ]] \
            || { echo "::error::no usable .python-version ('$python')"; exit 1; }
          echo "version=$python" >> "$GITHUB_OUTPUT"

  # The EL8 stub of every (target, Python) entry, linked as el8.yml links it from the tag
  # (`fsbpyr runtime build --python X --glibc 2.28`, tools/release/el8-stub.py), here twice in
  # independent caches, byte for byte identical; it needs no GLIBC_ symbol above 2.28 and carries
  # the runtime id this commit's fsbpyr expects. A link takes nothing from a tag (the runtime id
  # is a digest of the launcher sources, the Python pin and the sysroot), so these are the bytes
  # el8.yml publishes for this commit. Debian trixie and the toolchain as build.yml sets them up
  # (the image by digest, uv from tools/release/uv.version, clang/lld 23 from
  # tools/release/llvm23); no cache is shared between the two links.
  el8-stub:
    name: el8 stub (${{ matrix.target }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]  # as in the suite job
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      # The name this entry's stub is released under (vcs.release_stub_asset).
      ASSET: fsbpyr-stub-${{ matrix.python }}-${{ matrix.target }}-glibc2.28
      # As in build.yml: the runner's HOME is not root's, and fsbpyr refuses a cache whose way
      # from / another user owns. uv's cache goes under root's own home too.
      XDG_CACHE_HOME: /root/.cache
    steps:
      - name: Install git, xz, curl and zstd
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git curl xz-utils zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv and Python
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          echo "FSBPYR_UV_VERSION=$(sh tools/release/install-uv.sh /usr/local/bin)" >> "$GITHUB_ENV"
          uv python install "$MATRIX_PYTHON"

      - name: Record the toolchain
        run: |
          echo "commit:   $(git rev-parse HEAD)"
          echo "uv:       $(uv --version)"
          echo "llvm:     $(cat tools/release/llvm23) (tools/release/llvm23, the runtime's clang/lld)"
          dpkg-query -W xz-utils

      # The clang/lld 23 that links the stub, first on PATH from here on.
      - name: clang/lld 23 on PATH
        run: |
          clang="$(bash tools/bootstrap.sh --llvm23)"
          echo "${clang%/*}" >> "$GITHUB_PATH"

      # Each link in a fresh fsbpyr cache (its own PBS download, sysroot and runtime), in the
      # environment of the entry's Python (an older Python cannot canonicalize a newer one's
      # bytecode). el8-stub.py checks the stub and writes it under its asset name.
      - name: Link the EL8 stub twice
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          export UV_PROJECT_ENVIRONMENT=".venv-$MATRIX_PYTHON"
          for n in 1 2; do
            export FSBPYR_CACHE_DIR="/root/el8-cache-$n"
            uv run --python "$MATRIX_PYTHON" --locked fsbpyr runtime build --python "$MATRIX_PYTHON" --glibc 2.28
            uv run --python "$MATRIX_PYTHON" --locked python tools/release/el8-stub.py "$MATRIX_PYTHON" "stubs/$n"
          done

      - name: The two links are identical
        run: |
          if cmp "stubs/1/$ASSET" "stubs/2/$ASSET"; then
            echo "identical: $(sha256sum < "stubs/1/$ASSET" | cut -d' ' -f1)"
            exit 0
          fi
          echo "::error::two links of the EL8 stub in independent caches differ"
          sha256sum "stubs/1/$ASSET" "stubs/2/$ASSET"
          exit 1

      # As el8.yml compresses it: the BCJ filter of the architecture, one thread, so that the
      # same stub gives the same .xz. el8-portability and el8-vm-smoke place the .xz.
      - name: Compress the stub
        run: |
          case "$TARGET" in
            x86_64-*) filter=--x86 ;;
            aarch64-*) filter=--arm64 ;;
            *) echo "::error::no xz filter for $TARGET"; exit 1 ;;
          esac
          mkdir dist
          cp "stubs/1/$ASSET" "dist/$ASSET"
          xz $filter --lzma2=preset=9e --threads=1 --keep "dist/$ASSET"
          xz --decompress --stdout "dist/$ASSET.xz" | cmp - "dist/$ASSET"

      - name: Upload the stub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-stub-${{ matrix.python }}-${{ matrix.target }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.xz
          if-no-files-found: error

  # The executable of the default Python and every target as release.yml builds it from the tag
  # (build.yml without its checks, which the build job runs): from this commit tagged, in this job
  # only, as the version it declares, vX.Y.Z. Only a release's fsbpyr pairs itself with an EL8
  # stub placed beside it (stubs.py; a developer build uses the cache's runtimes), and that pairing
  # is what users run and what el8-portability and el8-vm-smoke test. On a release commit the
  # tag is the one `make release` pushes, and builds are reproducible, so this is the release
  # asset. Debian trixie by digest, the pinned uv, `make bootstrap` and `make build`, no cache.
  el8-build:
    name: el8 build (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: el8-python
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(format('["{0}"]', needs.el8-python.outputs.python)) }}  # the default Python only
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    timeout-minutes: 75
    env:
      ASSET: fsbpyr-${{ matrix.python }}-${{ matrix.target }}
      # As build.yml: caches under root's own home, not the runner's HOME.
      XDG_CACHE_HOME: /root/.cache
    steps:
      - name: Install git, xz, curl, make and zstd
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git curl xz-utils make zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing is pushed: the tag below stays in this job
          fetch-depth: 0  # the tags: the executable's --version names the vX.Y.Z tag on HEAD

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # As build.yml checks a tag: all three files declare the same version. The tag is moved
      # here if that version's release tag is on another commit (an earlier release's).
      - name: Tag the commit as its release
        run: |
          version="$(awk '/^\[/ { s = ($0 == "[project]") } s && /^version *=/ { print; exit }' pyproject.toml | cut -d'"' -f2)"
          module="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fsbpyr/__init__.py)"
          lock="$(awk '/^\[\[package\]\]/ { s = 0 } /^name = "fsbpyr"$/ { s = 1 } s && /^version *=/ { print; exit }' uv.lock | cut -d'"' -f2)"
          if [ "$module" != "$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::versions disagree: pyproject.toml $version, __init__.py $module, uv.lock $lock"
            exit 1
          fi
          git tag --force "v$version" HEAD
          echo "tagged in this job only: v$version on $(git rev-parse HEAD)"

      - name: Install uv and Python
        run: |
          echo "FSBPYR_UV_VERSION=$(sh tools/release/install-uv.sh /usr/local/bin)" >> "$GITHUB_ENV"
          uv python install "$(cat .python-version)"

      - name: Record the toolchain
        run: |
          echo "commit:   $(git rev-parse HEAD) ($(git tag --points-at HEAD --list 'v[0-9]*' | tr '\n' ' '))"
          echo "uv:       $(uv --version)"
          echo "llvm:     $(cat tools/release/llvm23) (tools/release/llvm23, the runtime's clang/lld)"
          dpkg-query -W xz-utils

      # The default version is no variant: dist/fsbpyr, which the installed fsbpyr then builds
      # again (`make build`), as build.yml does.
      - name: make bootstrap
        run: make bootstrap

      - name: make build
        run: make build

      - name: Name the executable as the release does
        run: cp dist/fsbpyr "dist/$ASSET"

      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-fsbpyr-${{ matrix.python }}-${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  # The stub-dependent tests (`make test-el8-stub`), in the suite job's setup (privileged
  # container, the user `tester`) minus podman, the coverage and the fuzzing, with /var/tmp a
  # tmpfs: the tests link the glibc 2.28 runtime themselves, with the same recipe as el8-stub.
  # Nothing skips: the Makefile leaves out the tests that need podman (-m "not podman"), which this
  # container lacks.
  el8-tests:
    name: el8 tests (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: el8-python
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(format('["{0}"]', needs.el8-python.outputs.python)) }}  # the default Python only
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container:
      image: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
      options: --privileged --pids-limit 8192 --memory 14g --memory-swap 14g  # as the suite job's
    timeout-minutes: 40
    steps:
      - name: Install the build prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make clang-22 lld-22

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: the executables the tests build report them

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        run: |
          echo "FSBPYR_UV_VERSION=$(sh tools/release/install-uv.sh /usr/local/bin)" >> "$GITHUB_ENV"

      - name: Set up the test environment
        run: bash tools/test-setup.sh

      # As in the suite job (no rootless podman here): the user's own copy of the checkout, a
      # tmpfs for the tests' temporary files (a symlink target of 4,000 bytes fails on a
      # container's overlay file system) and user namespaces open to unprivileged processes.
      - name: An unprivileged user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/tester/src
          chown -R tester: /home/tester
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then echo 0 > "$f"; fi
          mount -t tmpfs -o size=10g,mode=1777 tmpfs /var/tmp
          cat > /usr/local/bin/as-tester <<'WRAPPER'
          #!/bin/sh
          cd /home/tester/src || exit 1
          exec runuser -u tester -- env -i HOME=/home/tester USER=tester LANG=C.UTF-8 \
            PATH=/home/tester/.local/bin:/usr/local/bin:/usr/bin:/bin "$@"
          WRAPPER
          chmod 755 /usr/local/bin/as-tester

      - name: The Python of this entry
        run: as-tester uv python install "$(cat .python-version)"

      # make fetches clang/lld 23 and builds the runtimes itself. TESTTMP=/var/tmp: the tmpfs.
      - name: make test-el8-stub
        run: |
          as-tester FSBPYR_UV_VERSION="$FSBPYR_UV_VERSION" JOBS=4 \
            TESTTMP=/var/tmp PYTEST_ADDOPTS="--durations=30" make test-el8-stub

  # The portability matrix with apps built for glibc 2.28, on the runner host as the portability
  # job runs (nested podman in a container failed). el8-build's fsbpyr builds the apps and finds
  # el8-stub's stub beside it (only the .xz, the asset): the pairing of fsbpyr and stub that users
  # get, runtime id check included. The images are the portability job's 12 and rockylinux:8
  # and almalinux:8.
  el8-portability:
    name: el8 portability (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: [el8-python, el8-stub, el8-build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(format('["{0}"]', needs.el8-python.outputs.python)) }}  # the default Python only
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    timeout-minutes: 45
    env:
      ASSET: fsbpyr-${{ matrix.python }}-${{ matrix.target }}
      STUB: fsbpyr-stub-${{ matrix.python }}-${{ matrix.target }}-glibc2.28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The executable el8-build made (artifacts keep no file modes).
      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: el8-fsbpyr-${{ matrix.python }}-${{ matrix.target }}
          path: dist

      - name: Make it executable
        run: chmod +x "dist/$ASSET"

      - name: Download the stub
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: el8-stub-${{ matrix.python }}-${{ matrix.target }}
          path: stub

      # Beside the executable, compressed: what a user without GitHub places.
      - name: Place the stub beside the executable
        run: cp "stub/$STUB.xz" dist/

      - name: Install uv and llvm
        run: |
          sh tools/release/install-uv.sh "$RUNNER_TEMP/bin" > /dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends llvm

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::no DOCKERHUB_TOKEN secret: pulling anonymously"
          else
            printf '%s' "$DOCKERHUB_TOKEN" | podman login docker.io -u "$DOCKERHUB_USERNAME" \
              --password-stdin
          fi

      # The tests run on .python-version's Python; the apps are built for the entry's.
      - name: Build the apps with --glibc 2.28
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          uv python install "$(cat .python-version)" "$MATRIX_PYTHON"
          tools/portability-apps.sh "dist/$ASSET" "$RUNNER_TEMP/apps" "$MATRIX_PYTHON" 2.28

      - name: The portability tests
        run: |
          FSBPYR_TEST_GLIBC=2.28 FSBPYR_PORTABILITY_APPS="$RUNNER_TEMP/apps" \
            uv run --locked pytest tests/e2e/test_portability.py -rf --tb=short \
              --junitxml=portability.xml

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-portability-${{ matrix.python }}-${{ matrix.target }}
          path: portability.xml
          if-no-files-found: warn

  # A native-heavy part of the real-world corpus, built with the glibc 2.28 stub and compared with
  # the apps' venvs (tests/e2e/test_corpus.py): their wheels exist at manylinux_2_28 for every
  # Python and both machines (tests/support/locks.py reads the locks). The container and its
  # limits are the corpus job's.
  el8-corpus:
    name: el8 corpus (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: el8-python
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(format('["{0}"]', needs.el8-python.outputs.python)) }}  # the default Python only
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container:
      image: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
      options: --pids-limit 8192 --memory 14g --memory-swap 14g  # as the suite job's
    timeout-minutes: 40
    env:
      CORPUS_APPS: pandas-csv,lxml,pillow,scipy
    steps:
      - name: Install the build prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make clang-22 lld-22 zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the tags: fsbpyr's --version reads them

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv
        run: sh tools/release/install-uv.sh /usr/local/bin > /dev/null

      - name: An unprivileged user
        run: |
          useradd --create-home --uid 1000 tester
          cp -a "$GITHUB_WORKSPACE" /home/tester/src
          chown -R tester: /home/tester
          cat > /usr/local/bin/as-tester <<'WRAPPER'
          #!/bin/sh
          cd /home/tester/src || exit 1
          exec runuser -u tester -- env -i HOME=/home/tester USER=tester LANG=C.UTF-8 \
            PATH=/home/tester/.local/bin:/usr/local/bin:/usr/bin:/bin "$@"
          WRAPPER
          chmod 755 /usr/local/bin/as-tester

      - name: The Python of this entry
        run: as-tester uv python install "$(cat .python-version)"

      # An app whose lock needs a package without a wheel on this Python and machine (at
      # manylinux_2_28 in this mode) is not part of the run.
      - name: make test-corpus (glibc 2.28)
        run: |
          as-tester FSBPYR_TEST_GLIBC=2.28 FSBPYR_CORPUS_APPS="$CORPUS_APPS" \
            JOBS=4 \
            PYTEST_ADDOPTS="--durations=30 --junitxml=corpus.xml" make test-corpus

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-corpus-${{ matrix.python }}-${{ matrix.target }}
          path: /home/tester/src/corpus.xml
          if-no-files-found: warn

  # An app built with --glibc 2.28 on a 64 KiB-page kernel (EL8's aarch64) with the EL8 userland,
  # glibc 2.28 (tools/vm-smoke.py --userland el8, pins in tools/vm-pins.toml), under TCG, as the
  # vm-smoke job runs it. The apps are two fixtures (a pure-Python one and one with natives) that
  # el8-build's aarch64 fsbpyr builds with el8-stub's aarch64 stub beside it.
  el8-vm-smoke:
    name: el8 vm-smoke (aarch64-linux-gnu)
    needs: [el8-python, el8-stub, el8-build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_PYTHON: ${{ needs.el8-python.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: el8-fsbpyr-${{ needs.el8-python.outputs.python }}-aarch64-linux-gnu
          path: dist

      - name: Make it executable
        run: chmod +x dist/fsbpyr-*

      - name: Download the stub
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: el8-stub-${{ needs.el8-python.outputs.python }}-aarch64-linux-gnu
          path: stub

      - name: Place the stub beside the executable
        run: cp stub/*.xz dist/

      - name: Install uv and QEMU
        run: |
          sh tools/release/install-uv.sh "$RUNNER_TEMP/bin" > /dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            qemu-system-arm

      - name: Build the apps with --glibc 2.28
        run: |
          uv python install "$(cat .python-version)"
          mkdir -p "$RUNNER_TEMP/apps"
          for name in hello native; do
            cp -a "tests/fixtures/projects/$name" "$RUNNER_TEMP/$name"
            dist/fsbpyr-$APP_PYTHON-aarch64-linux-gnu build "$RUNNER_TEMP/$name" \
              --python "$APP_PYTHON" --glibc 2.28 -o "$RUNNER_TEMP/apps/$name"
          done

      # As the vm-smoke job, with the EL8 kernel and userland only, and without fsbpyr itself (it
      # needs glibc 2.34, which EL8 lacks). Exit 3: a pinned kernel or root file system is gone
      # from its mirror; a warning, as in the vm-smoke job, so a mirror cannot block a release,
      # until the pin is renewed (CONTRIBUTING.md).
      - name: Boot the 64K-page kernel with the EL8 userland and run the apps
        run: |
          status=0
          uv run --locked python tools/vm-smoke.py --kernel 64k --userland el8 \
            --app "$RUNNER_TEMP/apps/hello" --app "$RUNNER_TEMP/apps/native" \
            --run "hello 'x y' => hello ['x y']" \
            --run 'FSBPYR_SELFTEST=1 hello => selftest ok' \
            --run 'native => orjson {"a":[1,2]}' \
            --run 'FSBPYR_SELFTEST=natives native => all natives load' || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::el8 vm-smoke: a pinned input is unavailable; re-pin tools/vm-pins.toml"
            exit 0
          fi
          exit "$status"
