name: Release

# One build definition for both uses:
#   - pull requests and pushes to main: prove the release build works (`make bootstrap` on
#     Debian trixie, then the installed fsbpyr builds itself with `make build`, byte for byte
#     bootstrap's stage 3, then a smoke test) and run the static checks and the core of the
#     test suite (`make test-ci`), before any tag exists; tools/release/release.sh tags only a
#     commit whose main run and full-suite.yml's main run (every other test) passed;
#   - a pushed version tag (tools/release/release.sh pushes it): the same, then attest and
#     publish the GitHub release. Nothing is released unless the tests pass.
# GitHub artifact attestations can only be made inside GitHub Actions, so releases are built
# here and not on the maintainer's machine.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A tag is built once: a second run for the same tag waits instead of cancelling the first.
# Runs for a pull request or for main replace their predecessor.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: build + smoke test
    runs-on: ubuntu-24.04
    # Debian trixie, as `make bootstrap` expects, by digest: the tag alone moves. It installs no
    # tools, so the job does: clang/lld 22 and the rest from Debian's packages, the pinned uv
    # (tools/release/uv.version) and the Python of .python-version.
    container: docker.io/library/debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    timeout-minutes: 75
    env:
      PREFIX: ${{ github.workspace }}/../prefix
      # The container runs as root, but GitHub mounts its HOME (/github/home) owned by the
      # runner's user: fsbpyr refuses a cache whose way from / another user owns. The caches
      # (fsbpyr's, the executables' and uv's) go under root's own home instead. Not HOME
      # itself: job env also reaches the runner's docker CLI on the host, which then warns
      # that it cannot read /root/.docker/config.json.
      XDG_CACHE_HOME: /root/.cache
    steps:
      # git before the checkout: without it actions/checkout downloads a tarball, with no tags.
      # xz-utils decides fsbpyr.xz's bytes: it comes from the live mirror, here, and the log
      # records its version. ca-certificates and curl fetch uv.
      - name: Install git, xz and curl
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git curl xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config
          fetch-depth: 0  # the tags: the executable's --version names the vX.Y.Z tag on HEAD

      # The checkout belongs to another uid than the container's root: fsbpyr's git calls
      # (the commit and tag it records) would otherwise be refused.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Before a build is spent on it: the tag must name the version all three files declare.
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: |
          version="$(awk '/^\[/ { s = ($0 == "[project]") } s && /^version *=/ { print; exit }' pyproject.toml | cut -d'"' -f2)"
          module="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fsbpyr/__init__.py)"
          lock="$(awk '/^\[\[package\]\]/ { s = 0 } /^name = "fsbpyr"$/ { s = 1 } s && /^version *=/ { print; exit }' uv.lock | cut -d'"' -f2)"
          if [ "$module" != "$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::versions disagree: pyproject.toml $version, __init__.py $module, uv.lock $lock"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      # A tag is built from a snapshot of the Debian archive (tools/release/apt-snapshot), so
      # that clang and lld 22 are the versions the release was built with and a rebuild later
      # finds them; the snapshot replaces the image's sources, a second line beside them would
      # pin nothing. Main and pull request runs use the live mirror. make runs `make bootstrap`,
      # clang and lld 22 link the launcher, gcc (the tests' `cc`), strace and groff: tests that
      # would skip without them run.
      - name: Use the Debian snapshot
        if: github.ref_type == 'tag'
        run: |
          ts="$(tr -d '[:space:]' < tools/release/apt-snapshot)"
          cat > /etc/apt/sources.list.d/debian.sources <<EOF
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/$ts/
          Suites: trixie trixie-updates
          Components: main
          Check-Valid-Until: no
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/$ts/
          Suites: trixie-security
          Components: main
          Check-Valid-Until: no
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          EOF
          echo "FSBPYR_APT_SNAPSHOT=$ts" >> "$GITHUB_ENV"

      # snapshot.debian.org is slow now and then: three tries.
      - name: Install clang, lld and the test tools
        run: |
          for try in 1 2 3; do apt-get update -q && break; [ "$try" -lt 3 ] || exit 1; sleep 15; done
          apt-get install -y -q --no-install-recommends make clang-22 lld-22 gcc strace groff-base zstd

      # The uv that tools/release/uv.version names, from its release tarball and checked against
      # the sha256 recorded there, and the Python that .python-version pins. bootstrap.sh
      # installs no tool; with FSBPYR_UV_VERSION set it fails on any other uv.
      - name: Install uv and Python
        run: |
          read -r version sha256 < tools/release/uv.version
          name=uv-x86_64-unknown-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$version/$name.tar.gz"
          echo "$sha256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" --strip-components=1 -C /usr/local/bin \
            "$name/uv" "$name/uvx"
          echo "FSBPYR_UV_VERSION=$version" >> "$GITHUB_ENV"
          uv python install "$(cat .python-version)"

      # What the release was built with, for whoever reproduces it later.
      - name: Record the toolchain
        run: |
          echo "image:    $(grep -o 'debian:trixie@sha256:[0-9a-f]*' .github/workflows/release.yml | head -n1)"
          echo "snapshot: ${FSBPYR_APT_SNAPSHOT:-none (live mirror)}"
          echo "uv:       $(uv --version)"
          dpkg-query -W clang-22 lld-22 xz-utils
          apt-cache policy clang-22 lld-22

      # The locked environment, the runtime, fsbpyr in three stages
      # (each verified, stages 2 and 3 identical) and `make install` under $PREFIX. No cache: the release is built from the lock, never from
      # files another run cached.
      - name: make bootstrap
        run: make bootstrap

      # The installed fsbpyr builds itself again: what `make build` does once fsbpyr exists.
      - name: make build
        run: make build

      # The installed fsbpyr is stage 3 (stages 2 and 3 were identical), so what it built is
      # stage 3 again, byte for byte.
      - name: Compare with stage 3
        run: cmp dist/stage3/fsbpyr dist/fsbpyr

      - name: Smoke test
        run: |
          dist/fsbpyr --version
          dist/fsbpyr inspect --verify dist/fsbpyr
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$(dist/fsbpyr --version)" in
              *"${GITHUB_REF_NAME#v}-"*) ;;
              *) echo "::error::--version does not name $GITHUB_REF_NAME"; exit 1 ;;
            esac
          fi
          "$PREFIX/bin/fsbpyr" --version
          for f in share/man/man1/fsbpyr.1 share/bash-completion/completions/fsbpyr \
                   share/zsh/site-functions/_fsbpyr share/fish/vendor_completions.d/fsbpyr.fish; do
            test -s "$PREFIX/$f" || { echo "::error::make install left $f empty or missing"; exit 1; }
          done

      # The same executable, about half the download. One thread: the same input gives the same
      # .xz with the same xz (multithreaded xz splits the stream by thread count).
      - name: Compress the executable
        run: |
          xz --x86 --lzma2=preset=9e --threads=1 --keep dist/fsbpyr
          xz --decompress --stdout dist/fsbpyr.xz | cmp - dist/fsbpyr

      # The notices the executable carries, as a release asset (REP-4): the runtime's exact, the
      # dists' best effort. Deterministic, since the executable is.
      - name: Collect the licence notices
        run: dist/fsbpyr inspect --licenses dist/fsbpyr > dist/THIRD_PARTY_LICENSES.txt

      # Uploaded before the checks and tests, which run dev dependencies with write access to
      # dist/: the release is the executable compared above. publish needs this job, so
      # failing tests still stop the release.
      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsbpyr
          path: |
            dist/fsbpyr
            dist/fsbpyr.xz
            dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

      # Static checks and the core of the suite, on the environment `make bootstrap` left (the
      # .venv, the runtime). The rest of the suite runs locally (`make test`).
      - name: make check
        run: make check

      # pytest alone passes a run however many tests skip: here a skip that tests/conftest.py's
      # `ci` list does not expect (this container runs the tests as root) fails the step, and so
      # does a branch coverage below pyproject.toml's fail_under.
      - name: make test-ci
        id: test-ci
        env:
          FSBPYR_TESTS_REQUIRE_ALL: ci
        run: make test-ci

      # IMPLEMENTATION_PLAN.md §7 sets 90% for payload/ and elf.py, above the 80% overall; this
      # reads the data make test-ci left in .coverage.
      - name: Coverage of payload/ and elf.py
        run: |
          uv run --locked coverage report --include='src/fsbpyr/payload/*,src/fsbpyr/elf.py' \
            --fail-under=90

      # Also when a test or a coverage check failed, as long as make test-ci ran.
      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.test-ci.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # An independent rebuild of what build makes, in parallel with it: another checkout path and
  # owner, other cache directories, umask 077, on a fresh runner with the same image, snapshot
  # and uv. build's own stage 2 == stage 3 cannot see the launcher stub or anything that depends
  # on where it ran (D4); compare checks this job's stage 3 against build's executable.
  reproduce:
    name: reproduce (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    container: docker.io/library/debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]  # one entry per Python version a release is built for
    env:
      UV_PYTHON_INSTALL_DIR: /opt/uv-python  # root installs the Python, builder only reads it
    steps:
      - name: Install git, xz and curl
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git curl xz-utils

      # Not build's path (the workspace itself), and owned by another user, so that dist/ is
      # writable and git still records the same commit and tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rebuild
          persist-credentials: false
          fetch-depth: 0

      - name: Make the checkout builder's
        run: |
          useradd -m builder
          chown -R builder: rebuild
          chmod a+x "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Use the Debian snapshot
        if: github.ref_type == 'tag'
        working-directory: rebuild
        run: |
          ts="$(tr -d '[:space:]' < tools/release/apt-snapshot)"
          cat > /etc/apt/sources.list.d/debian.sources <<EOF
          Types: deb
          URIs: http://snapshot.debian.org/archive/debian/$ts/
          Suites: trixie trixie-updates
          Components: main
          Check-Valid-Until: no
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp

          Types: deb
          URIs: http://snapshot.debian.org/archive/debian-security/$ts/
          Suites: trixie-security
          Components: main
          Check-Valid-Until: no
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          EOF
          echo "FSBPYR_APT_SNAPSHOT=$ts" >> "$GITHUB_ENV"

      # bootstrap.sh installs no tool, so the packages are installed here, as build does.
      - name: Install clang, lld and the test tools
        run: |
          for try in 1 2 3; do apt-get update -q && break; [ "$try" -lt 3 ] || exit 1; sleep 15; done
          apt-get install -y -q --no-install-recommends make clang-22 lld-22 gcc strace groff-base

      - name: Install uv and Python
        working-directory: rebuild
        run: |
          read -r version sha256 < tools/release/uv.version
          name=uv-x86_64-unknown-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$version/$name.tar.gz"
          echo "$sha256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" --strip-components=1 -C /usr/local/bin \
            "$name/uv" "$name/uvx"
          echo "FSBPYR_UV_VERSION=$version" >> "$GITHUB_ENV"
          uv python install "${{ matrix.python }}"
          chmod -R a+rX "$UV_PYTHON_INSTALL_DIR"

      - name: Record the toolchain
        run: |
          echo "snapshot: ${FSBPYR_APT_SNAPSHOT:-none (live mirror)}"
          echo "uv:       $(uv --version)"
          dpkg-query -W clang-22 lld-22 xz-utils

      # Stage 1 to 3 as build does, as another user with other caches and umask 077.
      - name: Rebuild from source as builder
        working-directory: rebuild
        run: |
          test "$(cut -d. -f1,2 .python-version)" = "${{ matrix.python }}"
          runuser -u builder -- env HOME=/home/builder XDG_CACHE_HOME=/home/builder/c \
            UV_CACHE_DIR=/home/builder/uv UV_PYTHON_INSTALL_DIR="$UV_PYTHON_INSTALL_DIR" \
            FSBPYR_UV_VERSION="$FSBPYR_UV_VERSION" \
            sh -c 'umask 077; bash tools/bootstrap.sh --from-source'

      - name: Upload the rebuilt executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproduced-${{ matrix.python }}
          path: rebuild/dist/stage3/fsbpyr
          if-no-files-found: error

  # build's executable against reproduce's. Nothing is built here, so it runs on the runner.
  compare:
    name: compare (Python ${{ matrix.python }})
    needs: [build, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - name: Download both executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsbpyr
          path: built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reproduced-${{ matrix.python }}
          path: rebuilt

      # Artifacts do not keep file modes.
      - name: Compare byte for byte
        run: |
          chmod +x built/fsbpyr rebuilt/fsbpyr
          if cmp built/fsbpyr rebuilt/fsbpyr; then
            echo "identical: $(sha256sum < built/fsbpyr | cut -d' ' -f1)"
            exit 0
          fi
          echo "::error::the rebuild on an independent checkout differs from the release build"
          ls -l built/fsbpyr rebuilt/fsbpyr
          sha256sum built/fsbpyr rebuilt/fsbpyr
          diff <(built/fsbpyr inspect --json built/fsbpyr | jq -S .) \
               <(built/fsbpyr inspect --json rebuilt/fsbpyr | jq -S .) || true
          exit 1

  publish:
    name: attest + publish
    needs: [build, compare]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write: the build above ran with a read-only token.
    permissions:
      actions: read        # the parent commit's workflow runs (gh run list)
      contents: write      # create the GitHub release
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh gets the token through GH_TOKEN
          fetch-depth: 2  # the release commit and its parent

      # A release is made from a commit whose release.yml and full-suite.yml runs on main were
      # green: tools/release/release.sh checks that before it commits, this checks it again for
      # the parent of the release commit, which release.sh made on top of that commit. The
      # release commit may change nothing but the version and the changelog.
      - name: Check the parent commit's runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          parent="$(git rev-parse HEAD^)"
          for f in $(git diff --name-only HEAD^ HEAD); do
            case "$f" in
              CHANGELOG.md|pyproject.toml|src/fsbpyr/__init__.py|uv.lock) ;;
              *) echo "::error::the release commit changes $f, which release.sh does not touch"; exit 1 ;;
            esac
          done
          bash tools/release/green-run.sh release.yml "$parent" > /dev/null
          suite_run="$(bash tools/release/green-run.sh full-suite.yml "$parent")"
          echo "FULL_SUITE_RUN=$suite_run" >> "$GITHUB_ENV"

      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsbpyr
          path: dist

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash tools/release/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          printf '\nFull suite: %s\n' "$FULL_SUITE_RUN" >> "$RUNNER_TEMP/notes.md"

      # Verify with: gh attestation verify fsbpyr --repo devitops-com/fsbpyr \
      #   --signer-workflow devitops-com/fsbpyr/.github/workflows/release.yml \
      #   --source-ref "refs/tags/$tag"
      # (or fsbpyr.xz)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fsbpyr
            dist/fsbpyr.xz
            dist/THIRD_PARTY_LICENSES.txt

      # `sha256sum -c --ignore-missing SHA256SUMS` checks a download against the digests the
      # attestation signs.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          (cd dist && sha256sum fsbpyr fsbpyr.xz THIRD_PARTY_LICENSES.txt > SHA256SUMS)
          gh release create "$TAG" --verify-tag --title "fsbpyr $TAG" --notes-file "$NOTES" \
            dist/fsbpyr dist/fsbpyr.xz dist/THIRD_PARTY_LICENSES.txt dist/SHA256SUMS
