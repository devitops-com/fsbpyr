name: Release

# For a pushed version tag (tools/release/release.sh pushes it, on a main commit whose
# full-suite.yml run passed): build the executables from the tag (build.yml, without its
# checks: the full suite ran them on this very commit), attest them and leave a draft of the GitHub
# release, with every (target, Python) entry's executable, its .xz, licence notices and SBOM.
# Nothing is tested here. GitHub artifact attestations can only be made inside GitHub Actions, so
# releases are built here and not on the maintainer's machine.
#
# No release key is ever here, and this workflow publishes nothing (docs/signing.md §5.3): the
# admin checks the draft on their own machine, signs its sums there and publishes it, with
# `make release-sign`. prepare runs built code, with a read-only token and no secret; draft writes,
# and runs no built code.

on:
  push:
    tags: ["v*"]

# A tag is built once: a second run for the same tag waits instead of cancelling the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checks: false

  # One attestation per executable: attest-sbom takes one SBOM and the subjects it describes.
  # draft needs every one of them. It attests the SBOM that build made (the one draft
  # uploads); the full suite's compare checked that SBOM's bytes against its rebuild's.
  sbom:
    name: attest SBOM (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]
    permissions:
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    env:
      ASSET: fsbpyr-${{ matrix.python }}-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-${{ matrix.python }}-${{ matrix.target }}
          path: built

      # Verify with: gh attestation verify fsbpyr-3.14-x86_64-linux-gnu \
      #   --repo devitops-com/fsbpyr --predicate-type https://cyclonedx.org/bom
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: built/${{ env.ASSET }}
          sbom-path: built/${{ env.ASSET }}.cdx.json

  # The part of the release that runs built code: the newest x86-64 build reads the executables
  # for make-install.sh. So it gets no secret, and a token that can write nothing. Nothing it
  # makes is taken on trust: draft writes the sums again from the build job's files.
  prepare:
    name: install.sh + SHA256SUMS
    needs: [build, sbom]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config

      # Every target's and variant's files, side by side in dist/ (they have different names).
      # needs: build holds this back until every (target, Python) entry is built, the
      # aarch64 ones included.
      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: dist

      # The installer, with this release's version, targets, Pythons and the SHA-256 and glibc
      # of every executable written into it (tools/release/make-install.sh), so it lists every
      # target and Python that was built. The newest Python's x86-64 build runs on this runner
      # and reads the other files (aarch64 too) for their glibc.
      - name: Make install.sh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chmod +x dist/fsbpyr-3.*-x86_64-linux-gnu
          bash tools/release/make-install.sh "${TAG#v}" dist dist/install.sh

      # `sha256sum -c --ignore-missing SHA256SUMS` checks a download against the digests the
      # attestation signs. The globs take every target and Python that build made:
      # fsbpyr-3.X-TARGET with its .xz and its .cdx.json (the SBOM, attested by the sbom job),
      # and THIRD_PARTY_LICENSES-3.X-TARGET.txt; install.sh is listed too.
      - name: SHA256SUMS
        env:
          LC_ALL: C  # the order of the globs, which sign's copy must have too
        run: |
          (cd dist && sha256sum fsbpyr* THIRD_PARTY_LICENSES*.txt install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared
          path: |
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error

  # Attests the release and leaves it as a draft, which only the admin's `make release-sign`
  # publishes.
  draft:
    name: attest + draft
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write: the build above ran with a read-only token. It runs no built
    # code.
    permissions:
      actions: read        # the tagged commit's full suite run (gh run list)
      contents: write      # create the GitHub release
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh gets the token through GH_TOKEN
          fetch-depth: 0  # green-run.sh compares a documentation-only commit with its tested ancestor

      # A release is made from a main commit whose full-suite.yml run passed:
      # tools/release/release.sh checks that before it tags, this checks it again for the tagged
      # commit, and the release notes name the run.
      - name: Check the commit's full suite run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          suite_run="$(bash tools/release/green-run.sh full-suite.yml "$GITHUB_SHA")"
          echo "FULL_SUITE_RUN=$suite_run" >> "$GITHUB_ENV"

      - name: Download the executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: dist

      - name: Download install.sh and the sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared
          path: prepared

      # Before anything is attested or uploaded. prepare ran the built fsbpyr on a runner with
      # passwordless sudo, so its files are that code's to choose, and the pattern above would take
      # an artifact it uploaded under a name of its own: so the files must be exactly the assets of
      # every (Python, target). The sums are written again from them, so prepare's lines can name no
      # file that is not published, and the steps below take what the globs find. This does not
      # stop a poisoned build: the build job ran the same code.
      - name: Check the files against the sums
        env:
          LC_ALL: C
        shell: bash
        run: |
          expected=()
          for python in 3.12 3.13 3.14 3.15; do
            for target in x86_64-linux-gnu aarch64-linux-gnu; do
              expected+=("fsbpyr-$python-$target" "fsbpyr-$python-$target.xz"
                         "fsbpyr-$python-$target.cdx.json" "THIRD_PARTY_LICENSES-$python-$target.txt")
            done
          done
          found="$(cd dist && ls | sort)"
          [ "$found" = "$(printf '%s\n' "${expected[@]}" | sort)" ] \
            || { echo "::error::the build job's files are not the assets expected:"; echo "$found"; exit 1; }
          cp prepared/install.sh dist/
          (cd dist && sha256sum fsbpyr* THIRD_PARTY_LICENSES*.txt install.sh > ../found)
          cp prepared/SHA256SUMS dist/
          cmp found dist/SHA256SUMS \
            || { echo "::error::prepare's SHA256SUMS is not the sums of the build job's files"; exit 1; }

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash tools/release/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          printf '\nFull suite: %s\n' "$FULL_SUITE_RUN" >> "$RUNNER_TEMP/notes.md"

      # Verify with: gh attestation verify fsbpyr-3.14-x86_64-linux-gnu --repo devitops-com/fsbpyr \
      #   --signer-workflow devitops-com/fsbpyr/.github/workflows/release.yml \
      #   --source-ref "refs/tags/$tag"
      # (or fsbpyr-3.12-aarch64-linux-gnu, a .xz, install.sh, SHA256SUMS and the other assets)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fsbpyr*
            dist/THIRD_PARTY_LICENSES*.txt
            dist/install.sh
            dist/SHA256SUMS

      # Unsigned, and a draft: nobody can see it but those with write access, and no fsbpyr would
      # accept it. Only the admin's `make release-sign` publishes it.
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          assets=(dist/fsbpyr* dist/THIRD_PARTY_LICENSES*.txt dist/install.sh dist/SHA256SUMS)
          gh release create "$TAG" --verify-tag --draft --title "fsbpyr $TAG" \
            --notes-file "$NOTES" "${assets[@]}"
