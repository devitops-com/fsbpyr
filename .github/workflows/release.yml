name: Release

# One build definition for both uses:
#   - pull requests: prove the release build works (fsbpyr builds itself, then a smoke test of
#     the executable and of `make install`) before any tag exists;
#   - a pushed version tag (tools/release/release.sh pushes it): build, then attest and
#     publish the GitHub release.
# GitHub artifact attestations can only be made inside GitHub Actions, so releases are built
# here and not on the maintainer's machine.

on:
  push:
    tags: ["v*"]
  pull_request:

# A tag is built once: a second run for the same tag waits instead of cancelling the first.
# Runs for a pull request replace their predecessor.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: build + smoke test
    # The LLVM apt repository below is per Ubuntu release: pinned, not ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config
          fetch-depth: 0  # the tags: the executable's --version names the vX.Y.Z tag on HEAD

      # Before a build is spent on it: the tag must name the version all three files declare.
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fsbpyr/__init__.py)"
          lock="$(python3 -c 'import tomllib; print(*[p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "fsbpyr"])')"
          for v in "$module" "$lock"; do
            [ "$v" = "$version" ] || { echo "::error::versions disagree: pyproject.toml $version, __init__.py $module, uv.lock $lock"; exit 1; }
          done
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      # uv fetches the Python of .python-version and the locked dependencies; fsbpyr then
      # fetches the pinned python-build-standalone and glibc sysroot itself. No cache: the
      # release is built from the lock, never from files another run cached.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      # `fsbpyr runtime build` links the launcher against python-build-standalone's LLVM 22
      # bitcode: clang and lld 22 from apt.llvm.org (the runner has older ones).
      - name: Install clang and lld 22
        run: |
          codename="$(lsb_release -cs)"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-22 lld-22
          clang-22 --version

      - name: Bootstrap (locked environment + runtime)
        run: make bootstrap

      # The build's own smoke test runs the new executable once.
      - name: Build dist/fsbpyr
        run: make build

      - name: Smoke test
        env:
          PREFIX: ${{ runner.temp }}/prefix
        run: |
          dist/fsbpyr --version
          dist/fsbpyr inspect --verify dist/fsbpyr
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$(dist/fsbpyr --version)" in
              *"${GITHUB_REF_NAME#v}-"*) ;;
              *) echo "::error::--version does not name $GITHUB_REF_NAME"; exit 1 ;;
            esac
          fi
          make install PREFIX="$PREFIX"
          "$PREFIX/bin/fsbpyr" --version
          for f in share/man/man1/fsbpyr.1 share/bash-completion/completions/fsbpyr \
                   share/zsh/site-functions/_fsbpyr share/fish/vendor_completions.d/fsbpyr.fish; do
            test -s "$PREFIX/$f" || { echo "::error::make install left $f empty or missing"; exit 1; }
          done

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsbpyr
          path: dist/fsbpyr
          if-no-files-found: error

  publish:
    name: attest + publish
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write: the build above ran with a read-only token.
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh gets the token through GH_TOKEN

      - name: Download the executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsbpyr
          path: dist

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/release/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"

      # Verify with: gh attestation verify fsbpyr --repo devitops-com/fsbpyr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fsbpyr

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
        run: gh release create "$TAG" --verify-tag --title "fsbpyr $TAG" --notes-file "$NOTES" dist/fsbpyr
