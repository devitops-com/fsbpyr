name: Release

# One build definition for both uses:
#   - pull requests: prove the release build works (`make bootstrap` on Debian trixie, then the
#     installed fsbpyr builds itself with `make build`, then a smoke test) and run the static
#     checks and the whole test suite, before any tag exists;
#   - a pushed version tag (tools/release/release.sh pushes it): the same, then attest and
#     publish the GitHub release. Nothing is released unless the tests pass.
# GitHub artifact attestations can only be made inside GitHub Actions, so releases are built
# here and not on the maintainer's machine.

on:
  push:
    tags: ["v*"]
  pull_request:

# A tag is built once: a second run for the same tag waits instead of cancelling the first.
# Runs for a pull request replace their predecessor.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: build + smoke test
    runs-on: ubuntu-24.04
    # Debian trixie, as `make bootstrap` expects: it installs clang/lld 22 and the rest from
    # Debian's packages (as root here, so without sudo) and uv from astral.sh.
    container: docker.io/library/debian:trixie
    timeout-minutes: 45
    env:
      PREFIX: ${{ github.workspace }}/../prefix
      # The container runs as root, but GitHub mounts its HOME (/github/home) owned by the
      # runner's user: fsbpyr refuses a cache whose way from / another user owns. The caches
      # (fsbpyr's, the executables' and uv's) go under root's own home instead. Not HOME
      # itself: job env also reaches the runner's docker CLI on the host, which then warns
      # that it cannot read /root/.docker/config.json.
      XDG_CACHE_HOME: /root/.cache
    steps:
      # git before the checkout: without it actions/checkout downloads a tarball, with no tags.
      # make runs `make bootstrap`, which installs the rest.
      - name: Install git and make
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git make

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config
          fetch-depth: 0  # the tags: the executable's --version names the vX.Y.Z tag on HEAD

      # The checkout belongs to another uid than the container's root: fsbpyr's git calls
      # (the commit and tag it records) would otherwise be refused.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Before a build is spent on it: the tag must name the version all three files declare.
      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: |
          version="$(awk '/^\[/ { s = ($0 == "[project]") } s && /^version *=/ { print; exit }' pyproject.toml | cut -d'"' -f2)"
          module="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fsbpyr/__init__.py)"
          lock="$(awk '/^\[\[package\]\]/ { s = 0 } /^name = "fsbpyr"$/ { s = 1 } s && /^version *=/ { print; exit }' uv.lock | cut -d'"' -f2)"
          if [ "$module" != "$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::versions disagree: pyproject.toml $version, __init__.py $module, uv.lock $lock"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      # OS packages, uv, the Python of .python-version, the runtime, fsbpyr in three stages
      # (each verified, stages 2 and 3 identical) and `make install` under $PREFIX. No cache: the release is built from the lock, never from
      # files another run cached.
      - name: make bootstrap
        run: make bootstrap

      # The installed fsbpyr builds itself again: what `make build` does once fsbpyr exists.
      - name: make build
        run: make build

      - name: Smoke test
        run: |
          dist/fsbpyr --version
          dist/fsbpyr inspect --verify dist/fsbpyr
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$(dist/fsbpyr --version)" in
              *"${GITHUB_REF_NAME#v}-"*) ;;
              *) echo "::error::--version does not name $GITHUB_REF_NAME"; exit 1 ;;
            esac
          fi
          "$PREFIX/bin/fsbpyr" --version
          for f in share/man/man1/fsbpyr.1 share/bash-completion/completions/fsbpyr \
                   share/zsh/site-functions/_fsbpyr share/fish/vendor_completions.d/fsbpyr.fish; do
            test -s "$PREFIX/$f" || { echo "::error::make install left $f empty or missing"; exit 1; }
          done

      - name: Upload the executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fsbpyr
          path: dist/fsbpyr
          if-no-files-found: error

  test:
    name: checks + test suite
    runs-on: ubuntu-24.04
    # Debian trixie, as for the build. Privileged: the tests run podman (the portability tests
    # start the apps on 13 distributions), strace and user namespaces inside this container.
    container:
      image: docker.io/library/debian:trixie
      options: --privileged
    timeout-minutes: 180
    steps:
      # bootstrap.sh's packages, plus what the tests use: clang's sanitizer runtimes (the
      # ASan/UBSan launcher, D38; Debian ships them apart from clang), llvm-22 (llvm-objdump,
      # llvm-symbolizer), strace, and rootless podman with what it needs in a container.
      - name: Install the build and test prerequisites
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git make clang-22 lld-22 \
            libclang-rt-22-dev llvm-22 strace \
            podman uidmap passt catatonit fuse-overlayfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # history and tags, as in the build job

      # Not as root: as root some cache-ownership tests have nothing to test (root owns /usr)
      # and podman would not be rootless. The checkout is copied to the user's home, where it
      # and fsbpyr's cache belong to that user, as fsbpyr requires.
      - name: An unprivileged user, with rootless podman
        run: |
          useradd --create-home tester
          grep -q '^tester:' /etc/subuid || echo 'tester:100000:65536' >> /etc/subuid
          grep -q '^tester:' /etc/subgid || echo 'tester:100000:65536' >> /etc/subgid
          cp -a "$GITHUB_WORKSPACE" /home/tester/src
          # Inside a container: no systemd for cgroups or the event log, and an overlay
          # filesystem that podman's own overlay storage cannot stack on.
          mkdir -p /home/tester/.config/containers /home/tester/run
          printf '[storage]\ndriver = "vfs"\n' > /home/tester/.config/containers/storage.conf
          printf '[engine]\ncgroup_manager = "cgroupfs"\nevents_logger = "file"\n' \
            > /home/tester/.config/containers/containers.conf
          chown -R tester: /home/tester
          chmod 700 /home/tester/run
          # Ubuntu's AppArmor keeps unprivileged processes out of user namespaces (rootless
          # podman, the `unshare -r` tests); the setting is the host's, writable when privileged.
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then echo 0 > "$f"; fi

      # uv from astral.sh, then ruff + mypy and the whole suite (it builds the runtime, and its
      # ASan/UBSan variant, on first use).
      - name: make check, make test
        run: |
          runuser -u tester -- env -i HOME=/home/tester USER=tester LANG=C.UTF-8 \
            XDG_RUNTIME_DIR=/home/tester/run PATH=/usr/local/bin:/usr/bin:/bin \
            bash -c 'cd ~/src && bash tools/bootstrap.sh --uv && make check && make test'

  publish:
    name: attest + publish
    needs: [build, test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that may write: the build above ran with a read-only token.
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh gets the token through GH_TOKEN

      - name: Download the executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fsbpyr
          path: dist

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/release/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"

      # Verify with: gh attestation verify fsbpyr --repo devitops-com/fsbpyr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/fsbpyr

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/notes.md
        run: gh release create "$TAG" --verify-tag --title "fsbpyr $TAG" --notes-file "$NOTES" dist/fsbpyr
