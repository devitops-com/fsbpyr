name: EL8

# The EL8 (glibc 2.28) stubs of a release, built and published in a companion release. A
# release's executables need glibc 2.34; `fsbpyr build --glibc 2.28` builds apps for RHEL 8 and
# its rebuilds with the release's EL8 stub, a stub-only asset per (Python, target):
# `fsbpyr-stub-3.14-x86_64-linux-gnu-glibc2.28.xz`, with the SHA-256 of each in
# `SHA256SUMS-glibc2.28`. This workflow makes them, and it is OUTSIDE the release gate (owner,
# 2026-10-25): release.yml neither waits for it nor depends on it, and a release may have EL8
# stubs or not. A release without them is complete; `--glibc 2.28` says so plainly.
# Nothing is tested here, as nothing is in release.yml (owner, 2026-11-03): full-suite.yml's EL8
# jobs link every stub twice and compare the links, check the stubs and test them, on every
# push to main, and they gate the release. The plan job checks that the tag's commit passed
# full-suite.yml (tools/release/green-run.sh, as release.yml's draft job checks it). A stub's
# link takes nothing from the tag (its runtime id is a digest of the launcher sources, the Python
# pin and the sysroot) and is reproducible, so the stubs linked here have the bytes of those that
# run linked and tested.
# The stubs are not assets of the release itself: releases are immutable (REL-1), so vX.Y.Z takes
# none once published. They are the assets of the companion release el8-vX.Y.Z, on the same
# commit, which is not the latest release (`self update` and install.sh read that as vX.Y.Z).
# It runs on the release tag itself (owner, 2026-10-26; CodeQL flags a workflow that runs in the
# default branch's context and executes another ref's code, and its caches):
#   - for a pushed version tag, like release.yml (both start on the same push, in parallel), and
#   - on request, dispatched ON THE TAG'S REF, to publish the stubs of a release that has none
#     or to retry: `gh workflow run el8.yml --ref vX.Y.Z` (no inputs). Dispatched on a branch, the
#     plan job finds no tag and the run does nothing.
# So the workflow file used is the tag's, every job checks out the commit that started the run
# (the tag), and the tag's sources must have the EL8 support (plan checks).
# The stub job links the EL8 stub of every (target, Python) entry from the tag (`fsbpyr runtime
# build --python X --glibc 2.28`; tools/release/el8-stub.py writes it under its asset name once
# it needs no GLIBC_ symbol above 2.28 and carries the runtime id this tag's fsbpyr expects),
# each target on a runner of its architecture (x86_64-linux-gnu on ubuntu-24.04,
# aarch64-linux-gnu on ubuntu-24.04-arm), every Python (3.12 to 3.15, as full-suite.yml's
# matrix).
# draft needs every job of the run to pass. prepare writes SHA256SUMS-glibc2.28 over the stubs and
# their .xz, and draft attests them and leaves them in a draft of the companion release el8-vX.Y.Z;
# the release of the tag is not touched. No release key is ever here: the admin checks the draft on
# their own machine, signs its sums there and publishes it, with `make release-sign`
# (docs/signing.md §5.3). A run that finds the companion published with the same sums and a
# signature does nothing, and one that finds anything else fails: a published release cannot be
# changed. The attestations are this workflow's, from the tag's ref:
# `gh attestation verify` takes `--signer-workflow devitops-com/fsbpyr/.github/workflows/el8.yml --source-ref refs/tags/vX.Y.Z`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A tag is done once: a second run for the same tag waits instead of cancelling the first.
concurrency:
  group: el8-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Which release this run is for, or none: only a tag ref (a push of one, or a dispatch on one)
  # names a release, and only one whose commit passed full-suite.yml, which tests the stubs.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read   # the tagged commit's full suite run (gh run list)
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh gets the token through GH_TOKEN
          fetch-depth: 0  # green-run.sh compares a documentation-only commit with its tested ancestor

      # The tag is the ref this run is for, read through the environment and checked against
      # vX.Y.Z before any job uses it. The tag's sources must have what the jobs below run.
      - name: Which release
        id: release
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          xyz='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ "$REF" != "refs/tags/$REF_NAME" ] || ! [[ "$REF_NAME" =~ $xyz ]]; then
            echo "::notice::'$REF' is no release tag vX.Y.Z: nothing to publish (to retry, dispatch this workflow on the tag's ref)"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in src/fsbpyr/runtime/stubs.py tests/support/baseline.py tools/release/el8-stub.py; do
            [ -f "$file" ] \
              || { echo "::error::$REF_NAME has no $file: it predates the EL8 support, which the EL8 stubs of a release need"; exit 1; }
          done
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      # The stubs are tested in full-suite.yml only: a commit whose run did not pass gets none.
      # tools/release/release-assets.sh checked it before it tagged; this checks it again for the
      # tagged commit, as release.yml's draft job does.
      - name: Check the commit's full suite run
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/release/green-run.sh full-suite.yml "$GITHUB_SHA"

  # The EL8 stub of every (target, Python) entry, linked once: full-suite.yml's el8-stub job links
  # it twice in independent caches and compares the links. Debian trixie and the toolchain as
  # build.yml and that job set them up (the image by digest, uv from tools/release/uv.version,
  # clang/lld 23 from tools/release/llvm23), in a fresh cache.
  stub:
    name: stub (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]  # one entry per Python version a release is built for
        target: ["x86_64-linux-gnu", "aarch64-linux-gnu"]  # what the assets are named with
        include:
          - {target: "x86_64-linux-gnu", runner: "ubuntu-24.04"}
          - {target: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm"}
    container: docker.io/library/debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      # The name this entry's stub is released under (vcs.release_stub_asset).
      ASSET: fsbpyr-stub-${{ matrix.python }}-${{ matrix.target }}-glibc2.28
      # As in build.yml: the runner's HOME is not root's, and fsbpyr refuses a cache whose way
      # from / another user owns. uv's cache goes under root's own home too.
      XDG_CACHE_HOME: /root/.cache
    steps:
      - name: Install git, xz, curl and zstd
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git curl xz-utils zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step needs the token in .git/config

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install uv and Python
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          echo "FSBPYR_UV_VERSION=$(sh tools/release/install-uv.sh /usr/local/bin)" >> "$GITHUB_ENV"
          uv python install "$MATRIX_PYTHON"

      - name: Record the toolchain
        run: |
          echo "tag:      $GITHUB_REF_NAME ($(git rev-parse HEAD))"
          echo "uv:       $(uv --version)"
          echo "llvm:     $(cat tools/release/llvm23) (tools/release/llvm23, the runtime's clang/lld)"
          dpkg-query -W xz-utils

      # The clang/lld 23 that links the stub, first on PATH from here on.
      - name: clang/lld 23 on PATH
        run: |
          clang="$(bash tools/bootstrap.sh --llvm23)"
          echo "${clang%/*}" >> "$GITHUB_PATH"

      # In a fresh fsbpyr cache (its own PBS download, sysroot and runtime), in the environment of
      # the entry's Python (an older Python cannot canonicalize a newer one's bytecode).
      # el8-stub.py checks the stub and writes it under its asset name.
      - name: Link the EL8 stub
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          export UV_PROJECT_ENVIRONMENT=".venv-$MATRIX_PYTHON" FSBPYR_CACHE_DIR=/root/el8-cache
          uv run --python "$MATRIX_PYTHON" --locked fsbpyr runtime build --python "$MATRIX_PYTHON" --glibc 2.28
          uv run --python "$MATRIX_PYTHON" --locked python tools/release/el8-stub.py "$MATRIX_PYTHON" stubs

      # As build.yml compresses an executable: the BCJ filter of the architecture, one thread,
      # so that the same stub gives the same .xz.
      - name: Compress the stub
        run: |
          case "$TARGET" in
            x86_64-*) filter=--x86 ;;
            aarch64-*) filter=--arm64 ;;
            *) echo "::error::no xz filter for $TARGET"; exit 1 ;;
          esac
          mkdir dist
          cp "stubs/$ASSET" "dist/$ASSET"
          xz $filter --lzma2=preset=9e --threads=1 --keep "dist/$ASSET"
          xz --decompress --stdout "dist/$ASSET.xz" | cmp - "dist/$ASSET"

      - name: Upload the stub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-stub-${{ matrix.python }}-${{ matrix.target }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.xz
          if-no-files-found: error

  # The sums of every stub and of its .xz, nothing else: stubs.py checks the .xz against its line
  # before lzma sees it, and each .xz must unpack to the stub it is listed with. It runs only
  # sha256sum, xz and cmp, no built code, so it gets no secret and nothing of the tag's.
  prepare:
    name: SHA256SUMS-glibc2.28
    needs: [plan, stub]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the stubs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: el8-stub-*
          merge-multiple: true
          path: stubs

      - name: SHA256SUMS-glibc2.28
        run: |
          mkdir dist
          expected=()
          for python in 3.12 3.13 3.14 3.15; do
            for target in x86_64-linux-gnu aarch64-linux-gnu; do
              expected+=("fsbpyr-stub-$python-$target-glibc2.28")
            done
          done
          found="$(cd stubs && ls | sort)"
          [ "$found" = "$(for name in "${expected[@]}"; do echo "$name"; echo "$name.xz"; done | sort)" ] \
            || { echo "::error::the stubs are not the 8 expected, each with its .xz:"; echo "$found"; exit 1; }
          (cd stubs && sha256sum "${expected[@]}" "${expected[@]/%/.xz}" > ../dist/SHA256SUMS-glibc2.28)
          for name in "${expected[@]}"; do
            xz --decompress --stdout "stubs/$name.xz" | cmp - "stubs/$name"
          done
          cat dist/SHA256SUMS-glibc2.28

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el8-sums
          path: dist/SHA256SUMS-glibc2.28
          if-no-files-found: error

  # Only when every job above passed (the default of `needs`): the stubs go to a release of their
  # own, the companion el8-vX.Y.Z of the release vX.Y.Z (owner, 2026-10-27). Releases are
  # immutable (REL-1): once published, vX.Y.Z accepts no asset, so the stubs, which come after it,
  # cannot join it. The only job that may write, and it runs nothing of the tag's.
  draft:
    name: attest + draft
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the companion release and its tag
      id-token: write      # sign the attestation (Sigstore, through the job's OIDC token)
      attestations: write  # store it with the repository
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}  # github.ref_name, which the plan job checked
      COMPANION: el8-${{ needs.plan.outputs.tag }}  # not "v...": release.yml and this workflow run on v*
    steps:
      - name: Download the stubs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: el8-stub-*
          merge-multiple: true
          path: stubs

      - name: Download the sums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: el8-sums
          path: dist

      # Before anything is attested or uploaded: every file listed, and none that is not. A later
      # job can replace an earlier job's artifact of the same run.
      - name: Check the stubs against the sums
        run: |
          (cd stubs && sha256sum --quiet -c ../dist/SHA256SUMS-glibc2.28)
          [ "$(ls stubs | wc -l)" = "$(wc -l < dist/SHA256SUMS-glibc2.28)" ] \
            || { echo "::error::stubs/ does not hold exactly the files the sums list"; exit 1; }
          cp stubs/*.xz dist/

      # A published companion is immutable: a run that finds the very same sums, a signature and
      # every stub there has nothing to publish (a retry, or a second request; the links are
      # reproducible, so the same stubs give the same sums, and each signing gives other bytes, so
      # the .sig is only looked for: check-release.sh checks it against the pins), and one that
      # finds anything else cannot repair it. A draft may be the one that waits for the admin's
      # signature, so it is left alone and the run fails. `gh release view` finds drafts too.
      - name: Is it published
        id: published
        run: |
          if ! draft="$(gh release view "$COMPANION" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err")"; then
            grep -q "release not found" "$RUNNER_TEMP/view.err" || { cat "$RUNNER_TEMP/view.err"; exit 1; }
            echo "new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$draft" = true ]; then
            echo "::error::$COMPANION is a draft, which may be the one that waits for the admin's signature: it is left alone. If a stopped run left it, delete it by hand, then dispatch el8.yml on the tag ref again"
            exit 1
          fi
          assets="$(gh release view "$COMPANION" --json assets --jq '.assets[].name')"
          if grep -qx SHA256SUMS-glibc2.28 <<<"$assets"; then
            gh release download "$COMPANION" --pattern SHA256SUMS-glibc2.28 --dir published
            if cmp published/SHA256SUMS-glibc2.28 dist/SHA256SUMS-glibc2.28 \
                && [ -z "$(comm -23 <(cd dist && ls fsbpyr-stub-*.xz | sort) <(echo "$assets" | sort))" ] \
                && grep -qx SHA256SUMS-glibc2.28.sig <<<"$assets"; then
              echo "::notice::$COMPANION already has these EL8 stubs: nothing to publish"
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::error::$COMPANION is published with other stubs, and a published release is immutable: these stubs need a new version"
          exit 1

      # The tag el8-vX.Y.Z is pushed by `make release` with vX.Y.Z (tools/release/release.sh):
      # GitHub refuses a GitHub Actions token a release or tag whose target is a commit that adds
      # or changes a workflow file, as a release's merge commit often does (HTTP 403, v0.27.0),
      # so the release is made on the existing tag without a target, as release.yml makes its
      # own. The tag must be on the tag's commit, checked here and not after the publication,
      # which is immutable.
      - name: The companion tag
        if: steps.published.outputs.new == 'true'
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/tags/$COMPANION" > /dev/null 2> "$RUNNER_TEMP/ref.err"; then
            grep -q "Not Found" "$RUNNER_TEMP/ref.err" || { cat "$RUNNER_TEMP/ref.err"; exit 1; }
            echo "::error::the tag $COMPANION does not exist: make release pushes it with $TAG; push it on $TAG's commit (git push hub $TAG^{commit}:refs/tags/$COMPANION), then dispatch el8.yml on the tag ref again"
            exit 1
          fi
          [ "$(gh api "repos/$GH_REPO/commits/$COMPANION" --jq .sha)" = "$GITHUB_SHA" ] \
            || { echo "::error::the tag $COMPANION exists on another commit than $TAG's (${GITHUB_SHA:0:8}); delete it or move it to that commit, then dispatch el8.yml on the tag ref again"; exit 1; }

      # Verify with: gh attestation verify fsbpyr-stub-3.14-x86_64-linux-gnu-glibc2.28.xz \
      #   --repo devitops-com/fsbpyr \
      #   --signer-workflow devitops-com/fsbpyr/.github/workflows/el8.yml \
      #   --source-ref refs/tags/v0.26.0
      # (or any other stub's .xz, or SHA256SUMS-glibc2.28)
      - name: Attest build provenance
        if: steps.published.outputs.new == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fsbpyr-stub-*.xz
            dist/SHA256SUMS-glibc2.28

      # The draft takes the existing tag el8-vX.Y.Z (--verify-tag: never one made here, see
      # above), on the commit of the tag vX.Y.Z (the next step compares them again).
      # --latest=false: publishing a draft makes it the latest release unless told otherwise,
      # which `fsbpyr self update`, install.sh and check-release.sh read as vX.Y.Z, and an immutable
      # release cannot be corrected. `make release-sign` publishes it the same way.
      - name: Make the draft of the companion release
        if: steps.published.outputs.new == 'true'
        run: |
          cat > notes.md <<EOF
          The glibc 2.28 (RHEL 8) stubs of fsbpyr $TAG, one per Python and target, with the
          SHA-256 of each stub and of its .xz in SHA256SUMS-glibc2.28, and the release key's
          signature of that file. They pair with the fsbpyr
          $TAG of the same Python and target: \`fsbpyr build --glibc 2.28\` downloads the one it
          needs. To place one by hand, put its .xz next to the fsbpyr executable, under the same
          name; no download is then made.

          Verify with: gh attestation verify fsbpyr-stub-3.14-x86_64-linux-gnu-glibc2.28.xz --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/el8.yml --source-ref refs/tags/$TAG
          EOF
          gh release create "$COMPANION" --verify-tag --draft --latest=false \
            --title "EL8 stubs for $TAG" --notes-file notes.md \
            dist/fsbpyr-stub-*.xz dist/SHA256SUMS-glibc2.28

      # Published releases cannot be corrected, so say what went wrong at least. Read-only, and
      # run when the companion was published already too: a retry after a failed check (the
      # publication is immutable) must not end green.
      - name: Check the result
        if: steps.published.outputs.new != ''
        run: |
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          [ "$latest" != "$COMPANION" ] \
            || { echo "::error::the latest release is $COMPANION: self update and install.sh would not find fsbpyr"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/$COMPANION" --jq .sha)" = "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" ] \
            || { echo "::error::$COMPANION is not on the commit of $TAG"; exit 1; }
