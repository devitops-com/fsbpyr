[tool.poetry]
name = "foreign-poetry1-unpackaged"
version = "0.1.0"
description = "fsbpyr test fixture: a Poetry 1 project with package-mode = false and no [project]"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
click = ">=8.1"
rich = ">=13"
colorama = {version = ">=0.4.6", markers = "sys_platform == 'win32'"}
packaging = {version = ">=24", optional = true}

[tool.poetry.extras]
fancy = ["packaging"]

[tool.poetry.group.dev.dependencies]
iniconfig = ">=2"
