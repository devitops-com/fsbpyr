[project]
name = "compat"
version = "1.0.0"
description = "fsbpyr test fixture: the Phase 6 compatibility matrix"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1", "typer>=0.15", "rich>=13", "httpx>=0.28", "requests>=2.32", "certifi",
    "pydantic>=2.10", "jinja2>=3.1", "pyyaml>=6", "numpy>=2", "cryptography>=44",
    "orjson>=3.10", "tzdata", "sqlalchemy>=2", "setuptools>=80", "jaraco.classes",
]

[project.scripts]
compat = "compat.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
fs-packages = ["compat"]  # jinja2.PackageLoader needs a real templates/ directory
