version = 1
revision = 5
requires-python = ">=3.12"

[[package]]
name = "plugin-alpha"
version = "1.0.0"
source = { directory = "plugin-alpha" }

[[package]]
name = "plugin-beta"
version = "1.0.0"
source = { directory = "plugin-beta" }

[[package]]
name = "plugins"
version = "1.0.0"
source = { editable = "." }
dependencies = [
    { name = "plugin-alpha" },
    { name = "plugin-beta" },
]

[package.metadata]
requires-dist = [
    { name = "plugin-alpha", directory = "plugin-alpha" },
    { name = "plugin-beta", directory = "plugin-beta" },
]
