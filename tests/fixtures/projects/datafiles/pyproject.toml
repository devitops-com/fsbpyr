[project]
name = "datafiles"
version = "1.0.0"
description = "fsbpyr test fixture: packages that read data files next to their modules"
requires-python = ">=3.12"
dependencies = ["botocore>=1.35", "pytz>=2024.1", "babel>=2.16", "matplotlib>=3.9"]

[project.scripts]
datafiles = "datafiles.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
