[project]
name = "corpus-celery"
version = "1.0.0"
description = "fsbpyr corpus app: Celery with an in-process worker, memory broker and cache backend"
requires-python = ">=3.12"
dependencies = ["celery>=5.4"]

[project.scripts]
corpus-celery = "corpus_celery.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
