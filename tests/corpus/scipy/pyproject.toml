[project]
name = "corpus-scipy"
version = "1.0.0"
description = "fsbpyr corpus app: scipy's compiled libraries"
requires-python = ">=3.12"
dependencies = ["scipy>=1.14"]

[project.scripts]
corpus-scipy = "corpus_scipy.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
