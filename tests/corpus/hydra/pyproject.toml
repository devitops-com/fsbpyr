[project]
name = "corpus-hydra"
version = "1.0.0"
description = "fsbpyr corpus app: hydra's config package, plugin discovery through the hydra_plugins namespace"
requires-python = ">=3.12"
dependencies = ["hydra-core>=1.3", "omegaconf>=2.3"]

[project.scripts]
corpus-hydra = "corpus_hydra.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
