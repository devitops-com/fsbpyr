[project]
name = "corpus-cvxpy"
version = "1.0.0"
description = "fsbpyr corpus app: cvxpy with solver extension modules"
requires-python = ">=3.12"
dependencies = ["cvxpy>=1.6", "clarabel>=0.9", "scs>=3.2", "osqp>=0.6", "numpy>=2"]

[project.scripts]
corpus-cvxpy = "corpus_cvxpy.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
# Without it the smoke test fails: cvxpy/utilities/warn.py runs os.listdir() on the cvxpy package
# directory at import (NotADirectoryError: the directory is inside the executable).
fs-packages = ["cvxpy"]
