[project]
name = "corpus-dataframes"
version = "1.0.0"
description = "fsbpyr corpus app: polars, pyarrow and duckdb: Rust and C++ extension modules exchanging Arrow data"
requires-python = ">=3.12"
dependencies = ["polars>=1", "pyarrow>=18", "duckdb>=1.1", "pandas>=2.2"]

[project.scripts]
corpus-dataframes = "corpus_dataframes.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
