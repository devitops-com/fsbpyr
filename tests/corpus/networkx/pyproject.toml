[project]
name = "corpus-networkx"
version = "1.0.0"
description = "fsbpyr corpus app: networkx dispatch, scipy backends and GraphML"
requires-python = ">=3.12"
dependencies = ["networkx>=3.4", "scipy>=1.14", "numpy>=2"]

[project.scripts]
corpus-networkx = "corpus_networkx.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
