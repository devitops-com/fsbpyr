[project]
name = "corpus-validation"
version = "1.0.0"
description = "fsbpyr corpus app: jsonschema, marshmallow, faker, phonenumbers and email-validator"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "marshmallow>=3.23", "faker>=33", "phonenumbers>=8.13", "email-validator>=2.2", "referencing>=0.35"]

[project.scripts]
corpus-validation = "corpus_validation.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
