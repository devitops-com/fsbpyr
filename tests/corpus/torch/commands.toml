# Fails on 3.14 and 3.15 (found by this corpus): their default start method is forkserver,
# whose preload of '__main__' imports the main module only when the parent sends its
# main_path (multiprocessing/forkserver.py main). A built app's __main__ has no file, so
# fsbpyr sends none (boot/_fsbpyr_rt/mp.py): the forkserver does not import corpus_torch.cli,
# and each DataLoader worker imports torch itself, printing torch's NumPy warning once more
# than the venv's run. 3.12 and 3.13 fork their workers. Remove when the forkserver preloads
# the app's entry module.
known-failure = {reason = "the forkserver does not preload the entry module: each worker imports torch itself", pythons = ["3.14", "3.15"]}

expect = "checkpoint round trip True"

[[command]]
argv = []
