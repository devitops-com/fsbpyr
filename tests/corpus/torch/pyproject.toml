[project]
name = "corpus-torch"
version = "1.0.0"
description = "fsbpyr corpus app: torch: TorchScript source, dynamo, DataLoader workers"
requires-python = ">=3.12"
dependencies = ["torch>=2.5"]

[project.scripts]
corpus-torch = "corpus_torch.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
