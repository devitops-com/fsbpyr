[project]
name = "corpus-astropy"
version = "1.0.0"
description = "fsbpyr corpus app: astropy with its data files, IERS tables, FITS and ECSV"
requires-python = ">=3.12"
dependencies = ["astropy>=7", "numpy>=2", "scipy>=1.14"]

[project.scripts]
corpus-astropy = "corpus_astropy.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
# Without it: astropy reads astropy/CITATION at import, and astropy_iers_data/data/finals2000A.all
# for the IERS tables (NotADirectoryError: ".../corpus-astropy/astropy/CITATION").
fs-packages = ["astropy", "astropy_iers_data"]
