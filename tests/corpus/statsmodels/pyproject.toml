[project]
name = "corpus-statsmodels"
version = "1.0.0"
description = "fsbpyr corpus app: statsmodels with patsy and bundled datasets"
requires-python = ">=3.12"
dependencies = ["statsmodels>=0.14", "pandas>=2", "numpy>=2"]

[project.scripts]
corpus-statsmodels = "corpus_statsmodels.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
