[project]
name = "corpus-aiohttp"
version = "1.0.0"
description = "fsbpyr corpus app: aiohttp server and client over TLS, with websockets"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "cryptography>=43"]

[project.scripts]
corpus-aiohttp = "corpus_aiohttp.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
