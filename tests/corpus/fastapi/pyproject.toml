[project]
name = "corpus-fastapi"
version = "1.0.0"
description = "fsbpyr corpus app: FastAPI with pydantic, uvicorn (uvloop, httptools, websockets) and httpx"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "pydantic>=2"]

[project.scripts]
corpus-fastapi = "corpus_fastapi.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
