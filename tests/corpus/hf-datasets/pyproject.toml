[project]
name = "corpus-hf-datasets"
version = "1.0.0"
description = "fsbpyr corpus app: Hugging Face datasets: worker processes through multiprocess and dill, Arrow files"
requires-python = ">=3.12"
dependencies = ["datasets>=3"]

[project.scripts]
corpus-hf-datasets = "corpus_hf_datasets.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
