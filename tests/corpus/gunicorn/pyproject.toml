[project]
name = "corpus-gunicorn"
version = "1.0.0"
description = "fsbpyr corpus app: gunicorn arbiter and workers forked from a WSGI app"
requires-python = ">=3.12"
dependencies = ["gunicorn>=23"]

[project.scripts]
corpus-gunicorn = "corpus_gunicorn.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
