[project]
name = "corpus-ortools"
version = "1.0.0"
description = "fsbpyr corpus app: ortools CP-SAT, routing and GLOP"
requires-python = ">=3.12"
dependencies = ["ortools>=9.11"]

[project.scripts]
corpus-ortools = "corpus_ortools.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
