[project]
name = "corpus-pillow"
version = "1.0.0"
description = "fsbpyr corpus app: a Pillow thumbnailer"
requires-python = ">=3.12"
dependencies = ["pillow>=11"]

[project.scripts]
corpus-pillow = "corpus_pillow.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
