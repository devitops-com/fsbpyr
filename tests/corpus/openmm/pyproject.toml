[project]
name = "corpus-openmm"
version = "1.0.0"
description = "fsbpyr corpus app: openmm's plugin shared libraries"
requires-python = ">=3.12"
dependencies = ["openmm>=8.2"]

[project.scripts]
corpus-openmm = "corpus_openmm.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
