[project]
name = "corpus-pandas-csv"
version = "1.0.0"
description = "fsbpyr corpus app: a pandas CSV tool"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]

[project.scripts]
corpus-pandas-csv = "corpus_pandas_csv.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
