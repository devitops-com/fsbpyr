syntax = "proto3";

import "google/protobuf/timestamp.proto";

package corpus;

message HelloRequest {
  string name = 1;
  int32 count = 2;
}

message HelloReply {
  string message = 1;
  google.protobuf.Timestamp at = 2;
}

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayMany (HelloRequest) returns (stream HelloReply);
}
