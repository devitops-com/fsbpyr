[project]
name = "corpus-pytest-plugin"
version = "1.0.0"
description = "fsbpyr corpus app: pytest with a pluggy plugin registered by entry point"
requires-python = ">=3.12"
dependencies = ["pytest>=8"]

[project.scripts]
corpus-pytest-plugin = "corpus_pytest_plugin.cli:main"
[project.entry-points.pytest11]
corpus = "corpus_pytest_plugin.plugin"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
