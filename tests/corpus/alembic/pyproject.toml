[project]
name = "corpus-alembic"
version = "1.0.0"
description = "fsbpyr corpus app: alembic migrations in digit-named files"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14", "sqlalchemy>=2"]

[project.scripts]
corpus-alembic = "corpus_alembic.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
