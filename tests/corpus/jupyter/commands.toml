#   (the standard library is inside the executable): os.path.getmtime raises
#   NotADirectoryError. No setting puts the standard library on disk.
# - cause not found yet: the kernel, started as `sys.executable -m ipykernel_launcher` and run
#   as Python (interpreter-reexec), executes the cells as the venv's does, but its startup
#   line "[IPKernelApp] WARNING | Kernel is running over TCP without encryption ..."
#   (ipykernel/kernelapp.py init_sockets, logged when the kernel has no CurveZMQ key) is
#   missing from stderr. Ruled out: jupyter_client's transport_encryption (disabled in both),
#   the kernel's stdout and stderr (inherited in both), the kernelspec (both declare curve)
#   and ipykernel's blackhole.
