[project]
name = "corpus-jupyter"
version = "1.0.0"
description = "fsbpyr corpus app: nbclient starting an ipykernel subprocess, IPython, jedi and parso data files"
requires-python = ">=3.12"
dependencies = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "ipython>=8.30", "jedi>=0.19"]

[project.scripts]
corpus-jupyter = "corpus_jupyter.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
# nbclient starts the kernel as `sys.executable -m ipykernel_launcher -f ...`: refused
# (exit 70) without it, and before D44 each kernel ran the app again, without end.
interpreter-reexec = true
# Without them nbformat fails to validate (it reads its JSON schemas next to its modules) and
# jedi to complete (parso reads its grammar files next to its modules)
fs-packages = ["nbformat", "parso"]
