[project]
name = "corpus-sympy"
version = "1.0.0"
description = "fsbpyr corpus app: sympy with mpmath, gmpy2 and python-flint ground types"
requires-python = ">=3.12"
dependencies = ["sympy>=1.13", "mpmath>=1.3", "gmpy2>=2.2", "python-flint>=0.7", "numpy>=2"]

[project.scripts]
corpus-sympy = "corpus_sympy.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
