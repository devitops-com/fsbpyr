[project]
name = "corpus-qiskit"
version = "1.0.0"
description = "fsbpyr corpus app: qiskit transpiler plugins through entry points, Aer simulator"
requires-python = ">=3.12"
dependencies = ["qiskit>=2", "qiskit-aer>=0.17"]

[project.scripts]
corpus-qiskit = "corpus_qiskit.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
fs-packages = ["qiskit", "qiskit_aer"]  # qiskit and qiskit_aer open VERSION.txt next to their version.py (NotADirectoryError without them, at the build's smoke test)
