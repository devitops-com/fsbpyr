[project]
name = "corpus-vision"
version = "1.0.0"
description = "fsbpyr corpus app: opencv, scikit-image data and lazy_loader stubs, imageio-ffmpeg's bundled binary"
requires-python = ">=3.12"
dependencies = ["opencv-python-headless>=4.10", "scikit-image>=0.25", "imageio>=2.36", "imageio-ffmpeg>=0.6"]

[project.scripts]
corpus-vision = "corpus_vision.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
# cv2's loader executes config.py next to its __init__ ("OpenCV loader: missing configuration
# file"); scikit-image's lazy_loader reads the .pyi stubs next to its modules, and its data
# functions read their images from the package directory; imageio-ffmpeg runs its bundled
# ffmpeg from a path built from __file__ (the build warns about it)
fs-packages = ["cv2", "imageio_ffmpeg", "skimage"]
