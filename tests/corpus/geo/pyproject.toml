[project]
name = "corpus-geo"
version = "1.0.0"
description = "fsbpyr corpus app: shapely, pyproj, geopandas, pyogrio and rtree with their data directories and libspatialindex"
requires-python = ">=3.12"
dependencies = ["shapely>=2", "pyproj>=3.6", "geopandas>=1", "pyogrio>=0.10", "rtree>=1.3"]

[project.scripts]
corpus-geo = "corpus_geo.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.fsbpyr]
# Without it: pyproj fails "proj_create: no database context specified" (proj.db is in
# pyproj/proj_dir/share/proj); pyogrio prints "Could not detect GDAL data files" (gdal_data next to it).
fs-packages = ["pyproj", "pyogrio"]
