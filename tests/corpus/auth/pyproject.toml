[project]
name = "corpus-auth"
version = "1.0.0"
description = "fsbpyr corpus app: crypto and authentication libraries"
requires-python = ">=3.12"
dependencies = ["pyjwt[crypto]>=2.9", "cryptography>=44", "bcrypt>=4.2", "argon2-cffi>=23", "pynacl>=1.5", "authlib>=1.3", "itsdangerous>=2.2", "paramiko>=3.5"]

[project.scripts]
corpus-auth = "corpus_auth.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
